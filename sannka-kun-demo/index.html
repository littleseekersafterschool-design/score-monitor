<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>SANNKA-KUN 操作モック</title></head><body style="margin:0"><div id="sk4">
<style>
#sk4{font:13px/1.6 system-ui,'Noto Sans JP',sans-serif;color:#213d3a;background:#fff}#sk4 *{box-sizing:border-box}#sk4 button,#sk4 input,#sk4 textarea,#sk4 select{font:inherit}#sk4 button{cursor:pointer}#sk4 button:focus-visible,#sk4 input:focus-visible,#sk4 textarea:focus-visible{outline:3px solid #58bfb0;outline-offset:2px}#sk4 .app{border:1px solid #deebe7;border-radius:16px;overflow:hidden;background:#fff}#sk4 header{padding:17px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e4eeea}#sk4 .brand{font-size:10px;font-weight:900;letter-spacing:1.6px;color:#08786c}#sk4 h2{margin:2px 0;font-size:22px;letter-spacing:-.6px}#sk4 .muted{font-size:11px;color:#7a918d}#sk4 .toggle{display:flex;gap:3px;border-radius:22px;background:#eaf3ef;padding:3px}#sk4 .toggle button{border:0;padding:8px 12px;border-radius:18px;background:transparent;color:#58746f;font-weight:750;font-size:11px}#sk4 .toggle button.active{background:white;color:#096d62;box-shadow:0 1px 4px #064d4030}#sk4 main{padding:15px}#sk4 .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}#sk4 .btn{background:#fff;border:1px solid #cbded9;border-radius:10px;color:#1d655b;padding:9px 12px;font-size:12px;font-weight:800;min-height:36px}#sk4 .btn.primary{background:#0f8578;border-color:#0f8578;color:#fff}#sk4 .btn.danger{color:#af4646}#sk4 .btn.small{font-size:11px;padding:7px 9px;min-height:30px}#sk4 .push{flex:1}#sk4 .map{background:#f8fbfa;background-image:radial-gradient(#dae7e2 0.8px,transparent 0.8px);background-size:19px 19px;border:1px solid #dfeae5;border-radius:15px;min-height:430px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}#sk4 .group{border:1px dashed var(--line);background:var(--wash);border-radius:40px;min-height:185px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:10px;padding:15px}#sk4 .group.free{grid-column:1/-1;min-height:165px}#sk4 .qnode{background:#0f8275;color:#fff;border:0;border-radius:50%;width:79px;height:79px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:850;flex:none}#sk4 .qnode b{font-size:24px;line-height:1.2}#sk4 .bubble{border-radius:50%;width:var(--sz);height:var(--sz);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3px;line-height:1.3;padding:8px;border:2px solid var(--line);background:var(--bg);color:var(--fg);flex:none;transition:transform .2s,background .2s}#sk4 .bubble:hover,#sk4 .qnode:hover{transform:scale(1.04)}#sk4 .bubble b{font-size:12px}#sk4 .bubble small{font-weight:800;font-size:11px}#sk4 .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}#sk4 .legend span{font-size:10px;color:#607976;display:flex;align-items:center;gap:4px}#sk4 .sw{width:11px;height:11px;border-radius:50%;border:1px solid #b6c9c3}#sk4 .panel{border:1px solid #dfeae5;border-radius:14px;padding:16px}#sk4 .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}#sk4 .tabs button{border-radius:9px;border:1px solid #d8e7e1;background:#fff;padding:8px 10px;color:#607b76;font-size:11px}#sk4 .tabs button.sel{background:#e7f4ef;color:#116b5d;border-color:#88bcad;font-weight:800}#sk4 .entry{padding:11px 0;border-bottom:1px solid #e8eeeb;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}#sk4 .entry:last-child{border-bottom:0}#sk4 .entry b{font-size:12px}#sk4 .mini{font-size:10px;color:#748d86}#sk4 .field{display:grid;gap:6px;margin:12px 0}#sk4 .field label{font-size:12px;font-weight:750}#sk4 .field input,#sk4 .field select,#sk4 .field textarea{background:#fff;color:#203b37;border:1px solid #ccded7;padding:11px;border-radius:9px;width:100%;font-size:13px}#sk4 .field textarea{min-height:100px;resize:vertical}#sk4 .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}#sk4 .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}#sk4 .overlay{position:fixed;inset:0;z-index:999;background:#0a302ebd;display:flex;align-items:center;justify-content:center;padding:14px}#sk4 .modal{background:white;border-radius:17px;padding:21px;width:min(480px,100%);max-height:85vh;overflow:auto;box-shadow:0 15px 50px #12342b50}#sk4 .modal h3{font-size:20px;margin:8px 0 10px}#sk4 .modalHead{display:flex;justify-content:space-between;align-items:center}#sk4 .notice{border:1px solid #bbe4d2;background:#eef9f3;padding:12px 13px;border-radius:10px;font-size:12px}#sk4 .foot{font-size:10px;color:#7d928e;margin-top:11px}#sk4 .empty{padding:23px;text-align:center;color:#79928d}#sk4 select.sm{padding:7px;border-radius:8px;border:1px solid #c8d9d3;background:#fff;max-width:160px;font-size:11px}
@media(max-width:530px){#sk4 .map{grid-template-columns:1fr}#sk4 .group.free{grid-column:auto}#sk4 .two{grid-template-columns:1fr}#sk4 .bubble{width:calc(var(--sz)*.86);height:calc(var(--sz)*.86)}#sk4 .group{min-height:165px}#sk4 .app{border-radius:11px}}
</style>
<div class="app"><header><div><div class="brand">SANNKA-KUN</div><h2>みんなの発意ボード</h2><div class="muted">Little.Seekers｜操作モック・サンプルデータ</div></div><div id="roles" class="toggle"></div></header><main><div class="toolbar" id="toolbar"></div><div id="view"></div><div class="foot">このモック内だけで動作します。実際の施設データには接続しません。</div></main></div><div id="dialog"></div>
<script>
(()=>{
const root=document.getElementById('sk4');if(!root||root.dataset.started)return;root.dataset.started='1';
const $=s=>root.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='child',view='board',tab='pending',selection='a',seq=60;
const day=n=>{let d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const palette=[['#fff','#cfdbd7','#536a65','0〜4'],['#e6f5e5','#a6d7ac','#30643d','5〜9'],['#d8f0ec','#96d1c8','#226d63','10〜14'],['#dce9ff','#a3bde9','#29568e','15〜19'],['#ecddff','#bfa6e7','#62439a','20〜24'],['#ffe1b9','#edb479','#8b581c','25〜29'],['#ffbcae','#e48b77','#862d1e','30〜35+']];
const color=n=>palette[n<=4?0:n<=9?1:n<=14?2:n<=19?3:n<=24?4:n<=29?5:6];
const db={surveys:[{id:'a',label:'A',text:'次は何をして遊びたい？',start:'2020-01-01',end:'2099-12-31',status:'active'},{id:'b',label:'B',text:'みんなで何をつくりたい？',start:'2020-01-01',end:'2099-12-31',status:'active'}],groups:[{id:'g1',sid:'a',name:'サッカー',likes:12},{id:'g2',sid:'a',name:'ゲーム大会',likes:5},{id:'g3',sid:'a',name:'鬼ごっこ',likes:3},{id:'g4',sid:'b',name:'お菓子づくり',likes:9},{id:'g5',sid:'b',name:'工作',likes:6},{id:'g6',sid:null,name:'虫取り',likes:7},{id:'g7',sid:null,name:'魚を飼う',likes:18},{id:'g8',sid:null,name:'お祭り',likes:3}],ideas:[{id:'i1',sid:'a',gid:'g1',text:'サッカー大会がしたい',status:'approved'},{id:'i2',sid:'a',gid:'g1',text:'サッカーの試合をしたい',status:'approved'},{id:'i3',sid:'a',gid:'g2',text:'ゲーム大会がしたい',status:'approved'},{id:'i4',sid:'a',gid:'g3',text:'鬼ごっこがしたい',status:'approved'},{id:'i5',sid:'b',gid:'g4',text:'クッキーをつくりたい',status:'approved'},{id:'i6',sid:'b',gid:'g5',text:'段ボールで秘密基地をつくりたい',status:'approved'},{id:'i7',sid:null,gid:'g6',text:'虫取りに行きたい',status:'approved'},{id:'i8',sid:null,gid:'g7',text:'水槽に魚を飼いたい',status:'approved'}]};
const liked=new Set(),survey=id=>db.surveys.find(x=>x.id===id),group=id=>db.groups.find(x=>x.id===id),active=s=>s.status==='active'&&s.start<=day(0)&&s.end>=day(0);
const defaultNG=['死ね','しね','殺す','ころす','消えろ','くたばれ'];
let facilityNG=[];
try{const v=JSON.parse(localStorage.getItem('sannka_ngword_demo_v1')||'[]');if(Array.isArray(v))facilityNG=v.filter(x=>typeof x==='string'&&x.length<=30)}catch(e){}
function saveNG(){try{localStorage.setItem('sannka_ngword_demo_v1',JSON.stringify(facilityNG))}catch(e){}}
function normalized(text){return String(text||'').normalize('NFKC').toLowerCase().replace(/[\s　、。．・_＿ー～~！!？?\-]/g,'')}
function findNG(text){const n=normalized(text);return [...new Set([...defaultNG,...facilityNG].filter(w=>w&&n.includes(normalized(w))))]}
function publishIdea(i){let name=suggest(i.text),g=db.groups.find(g=>g.sid===i.sid&&g.name===name);if(!g){g={id:'g'+(++seq),sid:i.sid,name,likes:0};db.groups.push(g)}i.status='approved';i.gid=g.id;g.hidden=false}
function bubble(g){let c=color(g.likes),n=Math.min(118,Math.max(68,66+Math.sqrt(Math.max(0,g.likes))*9));let q=survey(g.sid);return `<button class="bubble" title="${safe(g.name+'／'+(q?q.text:'自由発意')+'／いいね '+g.likes)}" data-act="detail" data-id="${g.id}" style="--sz:${n}px;--bg:${c[0]};--line:${c[1]};--fg:${c[2]}"><b>${safe(g.name)}</b><small>♥ ${g.likes}</small></button>`}
function zone(q){let id=q?q.id:null;let list=db.groups.filter(g=>g.sid===id&&!g.hidden);let tip=q?'アンケート '+q.label+'｜'+q.text:'自由に発意する';return `<div class="group ${q?'':'free'}" style="--line:${q?'#b6d4da':'#b0d6b8'};--wash:${q?'#e9f5f780':'#e5f5e880'}"><button class="qnode" title="${safe(tip)}" data-act="${q?'answer':'free'}" data-id="${q?safe(q.id):''}"><b>${q?'▤':'✦'}</b>${q?'アンケート '+safe(q.label):'自由な発意'}</button>${list.map(bubble).join('')}</div>`}
function board(){let qs=db.surveys.filter(active);$('#view').innerHTML=`<div class="map">${qs.map(zone).join('')}${zone(null)}</div><div class="legend">${palette.map(c=>`<span><i class="sw" style="background:${c[0]}"></i>♥ ${c[3]}</span>`).join('')}</div>`}
function manager(){let ps=db.surveys.filter(q=>q.status==='pending'),pi=db.ideas.filter(i=>i.status==='pending');let text='';if(tab==='pending'){text=ps.map(q=>`<div class="entry"><div><b>問い：${safe(q.text)}</b><div class="mini">NGワード検出：${safe((q.ngHits||[]).join('、'))}</div></div><button class="btn primary small" data-act="approveSurvey" data-id="${q.id}">承認</button></div>`).join('')+pi.map(i=>`<div class="entry"><div><b>${safe(i.text)}</b><div class="mini">${i.sid?'アンケート回答':'自由発意'}・NGワード検出：${safe((i.ngHits||[]).join('、'))}</div></div><button class="btn primary small" data-act="approveIdea" data-id="${i.id}">承認</button><button class="btn danger small" data-act="rejectIdea" data-id="${i.id}">非公開</button></div>`).join('');if(!text)text='<div class="empty">承認待ちはありません。</div>'}if(tab==='ng'){
text=`<div style="font-size:13px;font-weight:850;margin-bottom:7px">標準NGワード（変更不可）</div><div class="mini" style="line-height:2.2">${defaultNG.map(x=>`<span style="display:inline-block;padding:2px 9px;margin:2px;background:#edf3f0;border-radius:20px">${safe(x)}</span>`).join('')}</div><div class="field"><label>施設で追加するNGワード</label><input id="addNGWord" maxlength="30" placeholder="例：施設で保留対象にしたい表現"></div><button class="btn primary small" data-act="addNGWord">＋ NGワードを追加</button><div style="margin-top:12px">${facilityNG.map((x,i)=>`<div class="entry"><b>${safe(x)}</b><button class="btn danger small" data-act="removeNGWord" data-id="${i}">削除</button></div>`).join('')||'<div class="mini">施設独自のNGワードはまだありません。</div>'}</div><div class="notice" style="margin-top:12px">NGワードに一致しない投稿は即時公開。一致した投稿だけ職員確認待ちになります。差別的な意見を排除するためではなく、安全上の確認に限定します。引用・相談も誤検出される場合があります。</div>`;
}
if(tab==='posts'){
text=db.ideas.filter(i=>i.status==='approved'||i.status==='hidden').map(i=>`<div class="entry"><div><b>${safe(i.text)}</b><div class="mini">${i.status==='approved'?'公開中':'非表示'}｜投稿者：${safe(i.authorId||'demo-child')}｜${i.sid?'アンケート回答':'自由発意'}</div></div><button class="btn small ${i.status==='approved'?'danger':''}" data-act="${i.status==='approved'?'hideIdea':'restoreIdea'}" data-id="${safe(i.id)}">${i.status==='approved'?'非表示にする':'再表示'}</button></div>`).join('')||'<div class="empty">該当する投稿はありません。</div>';
}
if(tab==='surveys'){text=db.surveys.map(q=>`<div class="entry"><div><b>${safe(q.text)}</b><div class="mini">${q.start} 〜 ${q.end}｜${q.status==='archived'?'アーカイブ':active(q)?'公開中':'公開待ち・期限外'}</div></div><button class="btn small" data-act="history" data-id="${q.id}">履歴</button>${active(q)?`<button class="btn small" data-act="archive" data-id="${q.id}">終了</button>`:''}</div>`).join('')};if(tab==='groups'){let sources=[...db.surveys.filter(s=>s.status!=='archived').map(s=>({id:s.id,label:'アンケート '+s.label})),{id:'free',label:'自由な発意'}];if(!sources.some(s=>s.id===selection))selection=sources[0]?.id||'free';let sid=selection==='free'?null:selection;let gs=db.groups.filter(g=>g.sid===sid),is=db.ideas.filter(i=>i.sid===sid&&i.status==='approved');text=`<div class="field"><label>グループの出どころ</label><select id="src">${sources.map(s=>`<option value="${s.id}" ${selection===s.id?'selected':''}>${safe(s.label)}</option>`).join('')}</select></div>`+gs.map(g=>`<div class="entry"><b>${safe(g.name)}　♥ ${g.likes}</b><button class="btn small" data-act="rename" data-id="${g.id}">名前変更</button></div>`).join('')+is.map(i=>`<div class="entry"><span>${safe(i.text)}</span><select class="sm" data-move="${i.id}">${gs.map(g=>`<option value="${g.id}" ${g.id===i.gid?'selected':''}>${safe(g.name)}</option>`).join('')}</select></div>`).join('')}
$('#view').innerHTML=`<div class="panel"><b>管理画面</b><div class="tabs"><button data-tab="pending" class="${tab==='pending'?'sel':''}">保留中 ${ps.length+pi.length}件</button><button data-tab="ng" class="${tab==='ng'?'sel':''}">NGワード設定</button><button data-tab="posts" class="${tab==='posts'?'sel':''}">投稿管理</button><button data-tab="groups" class="${tab==='groups'?'sel':''}">グループ編集</button><button data-tab="surveys" class="${tab==='surveys'?'sel':''}">アンケート・履歴</button></div>${text}</div>`}
function render(){$('#roles').innerHTML=`<button data-role="child" class="${role==='child'?'active':''}">こども体験</button><button data-role="staff" class="${role==='staff'?'active':''}">職員体験</button>`;$('#toolbar').innerHTML=view==='board'?`<button class="btn" data-act="free">＋ 自由に発意する</button><button class="btn primary" data-act="create">＋ みんなに問いかける</button><span class="push"></span>${role==='staff'?'<button class="btn" data-act="manage">管理画面</button>':''}`:`<button class="btn" data-act="board">← 発意ボードへ</button><span class="push"></span><button class="btn primary" data-act="create">＋ アンケート作成</button>`;view==='board'?board():manager()}
function popup(text){$('#dialog').innerHTML=`<div class="overlay"><div class="modal"><div class="modalHead"><b class="brand">SANNKA-KUN</b><button class="btn small" data-act="close">閉じる ×</button></div>${text}</div></div>`}
function close(){$('#dialog').replaceChildren()}
function complete(isQuestion,held){popup(`<h3>${held?'投稿を確認中です':isQuestion?'問いを公開しました！':'発意を公開しました！'}</h3><div class="notice">${held?'確認が必要な言葉を検出したため、投稿を受け付けて一時保留にしました。職員が確認するまで他のこどもには表示されません。':'投稿が完了し、発意ボードに反映されました。施設による事前承認はありません。'}</div><div class="actions"><button class="btn primary" data-act="board">発意ボードへ</button>${held?'<button class="btn" data-act="manage">職員の保留一覧を見る</button>':''}</div>`)}
function suggest(s){let r=[['サッカー',/サッカー|フットサル|ボール/],['ゲーム大会',/ゲーム|switch|スイッチ/i],['お菓子づくり',/お菓子|おかし|クッキー|ケーキ/],['工作',/工作|段ボール|秘密基地/],['虫取り',/虫|昆虫|生き物/],['魚を飼う',/魚|水槽|金魚/]];return r.find(x=>x[1].test(s))?.[0]||s.slice(0,12)}
function act(a,id){if(a==='close'){close();return}if(a==='board'){close();view='board';render();return}if(a==='manage'){close();view='manage';role='staff';tab='pending';render();return}if(a==='free'||a==='answer'){let q=a==='answer'?survey(id):null;popup(`<h3>${q?safe(q.text):'自由に発意する'}</h3><div class="muted">自分の言葉で意見を投稿してください。</div><div class="field"><label>やりたいこと・アイデア</label><textarea id="ideaText" maxlength="300" placeholder="やってみたいことを書いてね"></textarea></div><div class="actions"><button class="btn primary" type="button" data-act="postIdea" data-id="${q?q.id:''}">投稿する</button></div>`);return}
if(a==='create'){popup(`<h3>みんなに問いかける</h3><div class="field"><label>アンケートの問い</label><input id="questionText" maxlength="120" placeholder="例：次のイベントは何をしたい？"></div><div class="two"><div class="field"><label>公開開始日</label><input id="qStart" type="date" value="${day(0)}"></div><div class="field"><label>公開終了日</label><input id="qEnd" type="date" value="${day(7)}"></div></div><div class="actions"><button class="btn primary" type="button" data-act="postQuestion">問いを投稿する</button></div>`);return}
if(a==='postIdea'){let t=$('#ideaText')?.value.trim();if(!t){$('#ideaText')?.focus();return}let hits=findNG(t),i={id:'i'+(++seq),sid:id||null,gid:null,text:t,status:hits.length?'pending':'approved',authorId:'demo-child',ngHits:hits};db.ideas.push(i);if(!hits.length)publishIdea(i);complete(false,hits.length>0);return}
if(a==='postQuestion'){let t=$('#questionText')?.value.trim(),st=$('#qStart')?.value,en=$('#qEnd')?.value;if(!t){$('#questionText')?.focus();return}if(!st||!en||en<st){alert('公開期間を確認してください');return}let num=db.surveys.length;let hits=findNG(t);db.surveys.push({id:'s'+(++seq),label:num<26?String.fromCharCode(65+num):String(num+1),text:t,start:st,end:en,status:hits.length?'pending':'active',ngHits:hits});complete(true,hits.length>0);return}
if(a==='detail'){let g=group(id);if(!g)return;let originals=db.ideas.filter(i=>i.gid===id&&i.status==='approved');popup(`<h3>${safe(g.name)}</h3><div class="muted">♥ ${g.likes} いいね ／ 発意 ${originals.length}件</div>${originals.map(i=>`<div class="entry">${safe(i.text)}</div>`).join('')}<div class="actions"><button class="btn primary" data-act="like" data-id="${id}">${liked.has(id)?'♥ いいねを取り消す':'♡ いいね！'}</button></div>`);return}
if(a==='like'){let g=group(id);if(!g)return;g.likes+=liked.has(id)?-1:1;liked.has(id)?liked.delete(id):liked.add(id);render();act('detail',id);return}
if(a==='approveSurvey'){let q=survey(id);if(q){q.status='active';if(q.start>day(0))q.start=day(0);if(q.end<day(0))q.end=day(7)}render();return}
if(a==='approveIdea'){let i=db.ideas.find(i=>i.id===id);if(!i)return;publishIdea(i);render();return}
if(a==='rejectIdea'){let i=db.ideas.find(i=>i.id===id);if(i)i.status='rejected';render();return}
if(a==='addNGWord'){let word=$('#addNGWord')?.value.trim();if(!word)return;const target=normalized(word);if(!target||[...defaultNG,...facilityNG].some(x=>normalized(x)===target)){alert('同じNGワードが登録されています');return}facilityNG.push(word.slice(0,30));saveNG();render();return}
if(a==='removeNGWord'){let ix=Number(id);if(Number.isInteger(ix)&&ix>=0&&ix<facilityNG.length){facilityNG.splice(ix,1);saveNG();render()}return}
if(a==='hideIdea'){let i=db.ideas.find(i=>i.id===id);if(i&&i.status==='approved'){i.status='hidden';let g=group(i.gid);if(g&&!db.ideas.some(x=>x.gid===g.id&&x.status==='approved'))g.hidden=true;}render();return}
if(a==='restoreIdea'){let i=db.ideas.find(i=>i.id===id);if(i&&i.status==='hidden'){i.status='approved';let g=group(i.gid);if(g)g.hidden=false;}render();return}
if(a==='archive'){let q=survey(id);if(q)q.status='archived';render();return}
if(a==='history'){let q=survey(id);if(!q)return;let li=db.ideas.filter(i=>i.sid===id&&i.status==='approved');popup(`<h3>アンケートの履歴</h3><div class="notice"><b>${safe(q.text)}</b><br>${safe(q.start)}〜${safe(q.end)}<br>承認済み ${li.length}件</div>${li.map(i=>`<div class="entry">${safe(i.text)}</div>`).join('')}`);return}
if(a==='rename'){let g=group(id);popup(`<h3>グループ名の変更</h3><div class="field"><label>グループ名</label><input id="renameText" value="${safe(g.name)}"></div><div class="actions"><button class="btn primary" data-act="saveName" data-id="${id}">変更する</button></div>`);return}
if(a==='saveName'){let g=group(id),name=$('#renameText')?.value.trim();if(g&&name)g.name=name;close();render();return}}
root.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a){e.preventDefault();act(a.dataset.act,a.dataset.id);return}const r=e.target.closest('[data-role]');if(r){role=r.dataset.role;render();return}const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}});
root.addEventListener('change',e=>{if(e.target.id==='src'){selection=e.target.value;render();return}if(e.target.dataset.move){let i=db.ideas.find(x=>x.id===e.target.dataset.move);if(i){i.gid=e.target.value;render()}}});
root.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
})();
</script>
</div></body></html>
