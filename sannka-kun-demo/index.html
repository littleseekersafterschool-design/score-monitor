<script>
(()=>{
const root=document.getElementById('sk4');if(!root||root.dataset.started)return;root.dataset.started='1';
const $=s=>root.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='child',view='board',tab='pending',selection='a',seq=60;
const day=n=>{let d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const palette=[['#ffffff','#cfdfea','#526c80','0〜4'],['#e8f8ff','#b6dced','#23617c','5〜9'],['#c9edff','#8ecbe8','#185a7d','10〜14'],['#a8dfff','#66b9e7','#174d79','15〜19'],['#83c4f9','#489bdc','#103f6d','20〜24'],['#4e9ced','#2379ce','#ffffff','25〜29'],['#2365c3','#114894','#ffffff','30〜35+']];
const color=n=>palette[n<=4?0:n<=9?1:n<=14?2:n<=19?3:n<=24?4:n<=29?5:6];
const db={surveys:[{id:'a',label:'A',text:'次は何をして遊びたい？',start:'2020-01-01',end:'2099-12-31',status:'active'},{id:'b',label:'B',text:'みんなで何をつくりたい？',start:'2020-01-01',end:'2099-12-31',status:'active'}],groups:[{id:'g1',sid:'a',name:'サッカー',likes:12},{id:'g2',sid:'a',name:'ゲーム大会',likes:5},{id:'g3',sid:'a',name:'鬼ごっこ',likes:3},{id:'g4',sid:'b',name:'お菓子づくり',likes:9},{id:'g5',sid:'b',name:'工作',likes:6},{id:'g6',sid:null,name:'虫取り',likes:7},{id:'g7',sid:null,name:'魚を飼う',likes:18},{id:'g8',sid:null,name:'お祭り',likes:3}],ideas:[{id:'i1',sid:'a',gid:'g1',text:'サッカー大会がしたい',status:'approved'},{id:'i2',sid:'a',gid:'g1',text:'サッカーの試合をしたい',status:'approved'},{id:'i3',sid:'a',gid:'g2',text:'ゲーム大会がしたい',status:'approved'},{id:'i4',sid:'a',gid:'g3',text:'鬼ごっこがしたい',status:'approved'},{id:'i5',sid:'b',gid:'g4',text:'クッキーをつくりたい',status:'approved'},{id:'i6',sid:'b',gid:'g5',text:'段ボールで秘密基地をつくりたい',status:'approved'},{id:'i7',sid:null,gid:'g6',text:'虫取りに行きたい',status:'approved'},{id:'i8',sid:null,gid:'g7',text:'水槽に魚を飼いたい',status:'approved'},{id:'i9',sid:null,gid:'g8',text:'みんなでお祭りがしたい',status:'approved'}],islands:[{id:'island-sample',sid:'a',members:['g1','g3']}]};
const liked=new Set(),survey=id=>db.surveys.find(x=>x.id===id),group=id=>db.groups.find(x=>x.id===id),active=s=>s.status==='active'&&s.start<=day(0)&&s.end>=day(0);

const originalDemoData=JSON.parse(JSON.stringify(db));
try{
 const old=JSON.parse(localStorage.getItem('sannka_demo_data_v3')||'null');
 if(old&&Array.isArray(old.surveys)&&Array.isArray(old.groups)&&Array.isArray(old.ideas)){
  db.surveys=old.surveys;db.groups=old.groups;db.ideas=old.ideas;db.islands=Array.isArray(old.islands)?old.islands:[];db.cubes=Array.isArray(old.cubes)?old.cubes:undefined;db.missions=Array.isArray(old.missions)?old.missions:undefined;db.pendingNames=Array.isArray(old.pendingNames)?old.pendingNames:[];db.pendingIslandNames=Array.isArray(old.pendingIslandNames)?old.pendingIslandNames:[];db.ngRulesVersion=old.ngRulesVersion;db.popMailVersion=old.popMailVersion;
  const nums=[...db.surveys,...db.groups,...db.ideas,...db.islands,...(db.cubes||[]),...(db.missions||[]),...db.pendingNames,...db.pendingIslandNames].map(x=>Number((String(x.id||'').match(/\\d+$/)||[])[0])||0);
  seq=Math.max(seq,...nums);
 }
}catch(e){}
function saveDemo(){try{localStorage.setItem('sannka_demo_data_v3',JSON.stringify(db))}catch(e){}}
function groupCount(gid){return db.ideas.filter(i=>i.gid===gid&&i.status==='approved').length}
if(!Array.isArray(db.islands))db.islands=[];
function islandFor(groupId){return db.islands.find(i=>i.members.includes(groupId))}
function islandName(island){
 const memberNames=island.members.map(id=>group(id)?.name).filter(Boolean);
 return island.name?.trim()||memberNames.join('・')||'関連する発意';
}
if(!Array.isArray(db.pendingIslandNames))db.pendingIslandNames=[];
function setIslandName(island,name){
 if(!island)return false;
 const text=String(name||'').trim().slice(0,30);
 if(!text)return true;
 const hits=findNG(text);
 if(hits.length){
  db.pendingIslandNames=db.pendingIslandNames.filter(x=>x.islandId!==island.id);
  db.pendingIslandNames.push({id:'pin'+(++seq),islandId:island.id,name:text,ngHits:hits});
  saveDemo();
  return false;
 }
 island.name=text;
 db.pendingIslandNames=db.pendingIslandNames.filter(x=>x.islandId!==island.id);
 saveDemo();
 return true;
}
function addToIsland(fromId,targetId){
 const from=group(fromId),target=group(targetId);
 if(!from||!target||from.id===target.id||from.sid!==target.sid)return false;
 const a=islandFor(from.id),b=islandFor(target.id);
 if(a&&b&&a.id===b.id)return false;
 if(a&&b){b.members=[...new Set([...b.members,...a.members])];db.islands=db.islands.filter(i=>i.id!==a.id)}
 else if(b){b.members.push(from.id)}
 else if(a){a.members.push(target.id)}
 else db.islands.push({id:'island'+(++seq),sid:target.sid,members:[target.id,from.id]});
 db.islands.forEach(i=>i.members=[...new Set(i.members)]);
 saveDemo();return true;
}
function removeFromIsland(groupId){
 const island=islandFor(groupId);if(!island)return false;
 island.members=island.members.filter(id=>id!==groupId);
 if(island.members.length<2)db.islands=db.islands.filter(i=>i.id!==island.id);
 saveDemo();return true;
}
function splitIdea(ideaId){
 const idea=db.ideas.find(x=>x.id===ideaId&&x.status==='approved');
 const parent=group(idea?.gid);
 if(!idea||!parent||groupCount(parent.id)<2)return false;
 const newGroup={id:'g'+(++seq),sid:parent.sid,name:suggest(idea.text),likes:0};
 db.groups.push(newGroup);idea.gid=newGroup.id;
 const island=islandFor(parent.id);if(island)island.members.push(newGroup.id);
 saveDemo();return true;
}


/* Bubble / Project Cube MVP: AIは使用せず、発意データと公開済みキューブを接続する */
if(!Array.isArray(db.cubes)){
 db.cubes=[
 {id:'cube-sample-a',gid:'g1',title:'みんなでサッカー大会を開こう',why:'みんなで試合を楽しみたい',how:'チームを考えて、日時とルールを決める',support:'会場・安全確認',status:'mission',likes:7,myLiked:false,powers:2,myPowered:false,goal:6,deadline:'2099-12-31',tasks:'チーム分けとルール決め',createdBy:'demo-child'},
 {id:'cube-sample-b',gid:'g7',title:'水槽の生き物を育てよう',why:'生き物のことを学びたい',how:'育てたい魚を相談し、当番を決める',support:'道具と飼い方の相談',status:'proposed',likes:4,myLiked:false,powers:0,myPowered:false,goal:6,deadline:'2099-12-31',tasks:'',createdBy:'demo-child'}
 ].filter(c=>db.groups.some(g=>g.id===c.gid));
}

/* Migration: old cube status=mission belonged to visible board voting.
   In the new design, voting exists ONLY inside the user's inbox. */
if(db.popMailVersion!==1){
 for(const c of db.cubes){if(c.status==='mission')c.status='proposed';}
 db.popMailVersion=1;
}
if(!Array.isArray(db.missions)){
 const candidates=db.cubes.filter(c=>c.status==='proposed').map(c=>c.id).slice(0,4);
 db.missions=candidates.length>=1?[{
  id:'mission-sample',subject:'Power to Pop Mission!',title:'みんなのプロジェクトを選ぼう！',
  candidates,perUserVotes:1,winnerCount:1,deadline:'2099-12-31',status:'open',
  ballots:{},opened:{},resultOpened:{},winners:[],createdAt:'2026-11-11',publishedAt:null
 }]:[];
}
const demoAccounts=[{id:'demo-child-01',name:'あおい（3年）'},{id:'demo-child-02',name:'はる（4年）'},{id:'demo-child-03',name:'みお（2年）'}];
let currentAccount='demo-child-01';
try{const oldId=localStorage.getItem('sannka_current_account_v1');if(demoAccounts.some(x=>x.id===oldId))currentAccount=oldId;}catch(e){}
function saveAccount(){try{localStorage.setItem('sannka_current_account_v1',currentAccount)}catch(e){}}
function activeMission(id){return db.missions.find(x=>x.id===id)}

/* 施設から送る時点で、発意ボードにある公開済みの全キューブを対象とする */
function availableBoardCubes(){
 return db.cubes.filter(c=>{
  if(c.status!=='proposed')return false;
  const g=group(c.gid);if(!g||g.hidden||groupCount(g.id)===0)return false;
  if(g.sid!==null&&g.sid!==undefined){const q=survey(g.sid);if(!q||!active(q))return false}
  return true;
 });
}
function ballotAllocations(ballot){
 if(Array.isArray(ballot)){
  const out={};for(const id of ballot)out[id]=(out[id]||0)+1;return out;
 }
 return ballot&&typeof ballot==='object'&&!Array.isArray(ballot)?ballot:{};
}
function nomineeCount(m,cubeId){
 return Object.values(m.ballots||{}).reduce((n,ballot)=>n+(Number(ballotAllocations(ballot)[cubeId])||0),0);
}
function receivedVotes(m){return m.candidates.reduce((n,id)=>n+nomineeCount(m,id),0)}
function missionCandidates(m){return m.candidates.map(id=>cubeOf(id)).filter(Boolean)}
function missionRanking(m){
 return missionCandidates(m).map(c=>({...c,votes:nomineeCount(m,c.id)}))
 .sort((a,b)=>b.votes-a.votes||m.candidates.indexOf(a.id)-m.candidates.indexOf(b.id));
}
function finalizeMission(m,reason){
 if(!m||m.status!=='open')return false;
 const ranked=missionRanking(m),limit=Math.max(0,Math.min(Number(m.winnerCount)||1,ranked.length));
 // 0票の候補は「認定」にしない。同票なら候補登録順で順位を決める（デモ仕様）。
 const winners=ranked.filter(c=>c.votes>0).slice(0,limit).map(c=>c.id);
 m.winners=winners;m.status='results_sent';m.closedBy=reason;m.publishedAt=new Date().toISOString();
 m.resultOpened=m.resultOpened||{};m.boardViewed=m.boardViewed||{};
 for(const id of winners){
  const cube=cubeOf(id);
  if(cube&&cube.status==='proposed'){cube.status='popped';cube.recognizedMission=m.id}
 }
 saveDemo();return true;
}
function settleExpiredMissions(){
 let changed=false;
 for(const m of db.missions){
  if(m.status==='open'&&m.deadline&&day(0)>m.deadline)changed=finalizeMission(m,'deadline')||changed;
  if(m.status==='closed')changed=(m.status='open',finalizeMission(m,'legacy-closed'))||changed;
 }
 return changed;
}
function migratePowerMissions(){
 if(db.powerMissionVersion===2)return;
 for(const m of db.missions){
  m.ballots=m.ballots||{};
  for(const [userId,ballot] of Object.entries(m.ballots))m.ballots[userId]=ballotAllocations(ballot);
  m.opened=m.opened||{};m.resultOpened=m.resultOpened||{};
  m.boardViewed=m.boardViewed||{};
  // 従来のデモの既存投票・送信済み結果は維持する。
 }
 db.powerMissionVersion=2;
 saveDemo();
}
migratePowerMissions();
function inboxItems(){return [...db.missions].reverse().flatMap(m=>{
 let msgs=[];
 if(m.status==='results_sent')msgs.push({id:m.id,type:'result',read:!!m.resultOpened?.[currentAccount]});
 msgs.push({id:m.id,type:'invitation',read:!!m.opened?.[currentAccount]});
 return msgs;
})}
function unreadCount(){return inboxItems().filter(x=>!x.read).length}
function messageTitle(m,type){return type==='result'?'🎉 POP! Congrats!｜結果が届いたよ！':(m.subject||'⚡ Power to Pop Mission!')}
function cubeOf(id){return db.cubes.find(c=>c.id===id)}
function cubeStatus(c){return ({proposed:'企画アイデア',popped:'認定プロジェクト',progress:'実行中',done:'実行完了',pending:'職員の確認待ち',hidden:'非表示',rejected:'非公開'})[c.status]||c.status}
function visibleCubes(gid){return db.cubes.filter(c=>c.gid===gid&&['proposed','mission','popped','progress','done'].includes(c.status))}
function cubeAttached(gid){return visibleCubes(gid).sort((a,b)=>(['popped','progress','done'].includes(a.status)?-1:0)-(['popped','progress','done'].includes(b.status)?-1:0))}
function meter(c){let percent=Math.min(100,Math.round(100*(c.powers||0)/Math.max(1,c.goal||6)));return `<div class="meter" aria-label="投票の達成度 ${percent}%"><span style="width:${percent}%"></span></div><div class="inline-info">⚡ ${c.powers||0} / ${c.goal||6} パワー　（${percent}%）</div>`}
function cubeBlock(c){
 const g=group(c.gid),recognized=['popped','progress','done'].includes(c.status);
 return `<div class="cube-card"><div class="cube-head"><div class="cube-title">${recognized?'🔺':'🧊'} ${safe(c.title)}</div><span class="cube-status ${safe(c.status)}">${cubeStatus(c)}</span></div><div class="mini">元のバブル：${safe(g?.name||'不明')}</div><div class="inline-info" style="margin-top:6px">💜 ${c.likes||0} いいね！</div><div class="actions"><button class="btn small" data-act="cubeDetail" data-id="${safe(c.id)}">${recognized?'プロジェクトを見る':'キューブを見る'}</button></div></div>`;
}
function cubeFormCheck(values){return [...new Set(values.flatMap(x=>findNG(x||'')))]}
function cubeSanitizeExisting(){
 for(const c of db.cubes){
  if(['proposed','mission','popped','progress','done'].includes(c.status)){
    const hits=cubeFormCheck([c.title,c.why,c.how,c.support,c.tasks]);
    if(hits.length){c.status='pending';c.ngHits=hits;}
  }
 }
}

const defaultNG=['死ね','しね','死んで','しんで','殺す','殺し','殺せ','殺そう','殺され','ころす','ころし','ころせ','ころそう','ころされ','消えろ','くたばれ'];
let facilityNG=[];
try{const v=JSON.parse(localStorage.getItem('sannka_ngword_demo_v1')||'[]');if(Array.isArray(v))facilityNG=v.filter(x=>typeof x==='string'&&x.length<=30)}catch(e){}
function saveNG(){try{localStorage.setItem('sannka_ngword_demo_v1',JSON.stringify(facilityNG))}catch(e){}}
function normalized(text){return String(text||'').normalize('NFKC').toLowerCase().replace(/[\s　、。．・_＿ー～~！!？?\-]/g,'')}
function findNG(text){const n=normalized(text);return [...new Set([...defaultNG,...facilityNG].filter(w=>w&&n.includes(normalized(w))))]}

/* すべての公開テキストに共通の審査ロジックを適用 */
if(!Array.isArray(db.pendingNames))db.pendingNames=[];
function scanExistingText(){
 for(const q of db.surveys){
  if(q.status==='active'){
   const hits=findNG(q.text);
   if(hits.length){q.status='pending';q.ngHits=hits;}
  }
 }
 for(const i of db.ideas){
  if(i.status==='approved'){
   const hits=findNG(i.text);
   if(hits.length){i.status='pending';i.ngHits=hits;}
  }
 }
 for(const i of db.islands){
  if(i.name&&findNG(i.name).length){
    const proposed=i.name;i.name='';db.pendingIslandNames=db.pendingIslandNames||[];
    if(!db.pendingIslandNames.some(x=>x.islandId===i.id))db.pendingIslandNames.push({id:'pin'+(++seq),islandId:i.id,name:proposed,ngHits:findNG(proposed)});
  }
 }
 for(const g of db.groups){
  if(!g.hidden&&findNG(g.name).length){
   const hits=findNG(g.name);
   g.hidden=true;
   if(!db.pendingNames.some(x=>x.gid===g.id&&x.legacy)){
    db.pendingNames.push({id:'pn'+(++seq),gid:g.id,name:g.name,ngHits:hits,legacy:true});
   }
  }
 }

function fxReduced(){return typeof window!=='undefined'&&typeof window.matchMedia==='function'&&window.matchMedia('(prefers-reduced-motion: reduce)').matches}
function fxReact(anchor,kind='heart'){
 if(!anchor||fxReduced()||typeof document.createElement!=='function')return;
 const box=anchor.getBoundingClientRect();
 anchor.classList?.add('sk-react');
 setTimeout(()=>anchor.classList?.remove('sk-react'),960);
 const symbols=kind==='power'?['⚡','🫧','✨','⚡','🫧']:['💗','♡','💗','🫧','♡'];
 for(let i=0;i<symbols.length;i++){
  const p=document.createElement('span');p.className='sk-float-heart';
  p.textContent=symbols[i];p.style.left=(box.left+box.width/2+(i-2)*7)+'px';p.style.top=(box.top+box.height*.37)+'px';
  p.style.setProperty('--dx',((i-2)*27)+'px');p.style.setProperty('--dy',(-56-(i%3)*22)+'px');
  p.style.animationDelay=(i*.045)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),1450);
 }
}
function fxDecoratePop(scene){
 if(!scene||fxReduced()||typeof document.createElement!=='function')return;
 const colors=['#7dd3fc','#249cdf','#e7f9ff','#ffe28a','#67bdb3','#a1dcff','#3d8ddd'];
 for(let i=0;i<18;i++){
  const p=document.createElement('span'),a=(i/18)*Math.PI*2,dist=65+(i%4)*26;
  p.className='sk-confetti'+(i%4===0?' star':'');
  p.style.setProperty('--px',Math.round(Math.cos(a)*dist)+'px');p.style.setProperty('--py',Math.round(Math.sin(a)*dist-20)+'px');
  p.style.setProperty('--delay',(i%4)*.04+'s');p.style.setProperty('--spin',(i*53)+'deg');p.style.setProperty('--pbg',colors[i%colors.length]);
  scene.appendChild(p);
 }
}

 if(!m||m.status!=='open'||!m.candidates.includes(cubeId)||m.ballots?.[currentAccount])return;
 const key=m.id+'|'+currentAccount,ballot=voteDrafts[key]||(voteDrafts[key]={});
 const used=m.candidates.reduce((n,cid)=>n+(Number(ballot[cid])||0),0),count=Number(ballot[cubeId])||0;
 if(a==='votePlus'&&used<m.perUserVotes)ballot[cubeId]=count+1;
 if(a==='voteMinus'&&count>0)ballot[cubeId]=count-1;
 act('openMail',m.id+'|invitation');return;
}
if(a==='submitBallot'){
 const m=activeMission(id);if(!m||m.status!=='open'||(m.deadline&&m.deadline<day(0))||m.ballots?.[currentAccount])return;
 const allocations=voteDrafts[m.id+'|'+currentAccount]||{};
 const selected=Object.fromEntries(m.candidates.map(cid=>[cid,Number(allocations[cid])||0]).filter(([_,count])=>count>0));
 const total=Object.values(selected).reduce((n,c)=>n+c,0);
 if(total!==m.perUserVotes||Object.values(selected).some(n=>!Number.isInteger(n)||n<0)){alert('配られた'+m.perUserVotes+'票をすべて振り分けてください。');return}
 m.ballots[currentAccount]=selected;delete voteDrafts[m.id+'|'+currentAccount];
 saveDemo();render();
 popup(`<h3>⚡ パワーが届いたよ！</h3><div class="notice">${total}票を投票しました！<br>${Object.entries(selected).map(([id,n])=>safe(cubeOf(id)?.title||'不明')+'：'+n+'票').join(' ／ ')}</div>
 <div class="inline-info" style="margin-top:12px">同じミッションに同じアカウントからもう一度投票することはできません。期限終了後、結果がアカウントに届きます。</div>
 <div class="actions"><button class="btn primary" data-act="inbox">受信箱へ戻る</button></div>`);
 fxReact($('#dialog .notice'),'power');return;
}
if(a==='closeVoting'||a==='closeAndReview'){
 if(role!=='staff')return;const m=activeMission(id);if(!m||m.status!=='open')return;
 finalizeMission(m,'staff');view='manage';tab='cubes';render();
 popup(`<h3>📊 投票を終了しました</h3><div class="notice">投票を締め切り、結果を自動集計して上位 ${m.winnerCount}件までを認定しました。結果はこどもアカウントに届いています。認定キューブは、ボードを初めて開くときに三角に変身します。</div><div class="actions"><button class="btn primary" data-act="reviewMission" data-id="${safe(m.id)}">結果を確認する</button><button class="btn" data-act="inbox">こどもの受信箱へ</button></div>`);
 return;
}
if(a==='reviewMission'){
 if(role!=='staff')return;const m=activeMission(id);if(!m)return;settleExpiredMissions();
 const ranked=missionRanking(m),voters=Object.keys(m.ballots||{}).length,isDone=m.status==='results_sent';
 const accountRows=demoAccounts.map(a=>`<div class="entry"><div><b>${safe(a.name)}</b><div class="mini">${m.ballots[a.id]?'✅ 投票済み':m.opened?.[a.id]?'✉ 開封・未投票':'✉ 未開封'}</div></div><span class="badge">${m.ballots[a.id]?Object.values(ballotAllocations(m.ballots[a.id])).reduce((n,v)=>n+v,0)+'票':'—'}</span></div>`).join('');
 popup(`<h3>📊 ミッション投票ステータス</h3><div class="notice"><b>${safe(m.title)}</b><br>${isDone?'✅ 終了・結果反映済み':'🟢 受付中'}<br>投票した人数：${voters} / ${demoAccounts.length} 人<br>配分済みの票：${receivedVotes(m)}票 ／ 1人 ${m.perUserVotes}票<br>認定：上位 ${m.winnerCount}件 ／ 締切：${safe(m.deadline)}</div>
 <div class="inline-info" style="margin-top:12px;font-weight:800">キューブ別の投票状況${isDone?'（確定結果）':'（施設だけに公開）'}</div>
 ${ranked.map((c,index)=>`<div class="rank-row"><div><b>${index+1}位　${safe(c.title)}</b><div class="inline-info">⚡ ${c.votes}票　${isDone&&m.winners.includes(c.id)?'<span class="result-badge">認定！</span>':''}</div></div></div>`).join('')}
 <div class="inline-info" style="margin-top:14px;font-weight:800">アカウント別の進行状況</div>${accountRows}
 <div class="inline-info" style="margin-top:10px">同票は、ミッション送信時の候補一覧順で順位を決めるデモ仕様です。0票のキューブは認定しません。</div>
 <div class="actions">${!isDone?`<button class="btn primary" data-act="closeVoting" data-id="${safe(m.id)}">投票を終了して自動反映</button>`:''}<button class="btn" data-act="close">閉じる</button></div>`);
 return;
}
if(a==='markProgress'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='popped'){c.status='progress';saveDemo();render()}return;
}
if(a==='markDone'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='progress'){c.status='done';saveDemo();render()}return;
}
if(a==='taskEdit'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c)return;
 popup(`<h3>実行の役割・施設のサポート</h3><div class="notice">${safe(c.title)}</div><div class="field"><label>役割分担・準備・サポート</label><textarea id="cubeTasks" maxlength="400" placeholder="担当や準備、安全確認などを入力">${safe(c.tasks||'')}</textarea></div><div class="actions"><button class="btn primary" data-act="taskSave" data-id="${safe(c.id)}">保存する</button></div>`);return;
}
if(a==='taskSave'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c)return;
 const tasks=$('#cubeTasks')?.value.trim()||'';const hits=findNG(tasks);
 if(hits.length){popup('<h3>確認が必要な表現があります</h3><div class="notice">NGワードを検出したため、公開用の支援内容を保存しませんでした。表現を確認してください。</div><div class="actions"><button class="btn" data-act="cubeDetail" data-id="'+id+'">戻る</button></div>');return}
 c.tasks=tasks;saveDemo();close();render();return;
}
if(a==='approveCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='pending'){c.status='proposed';saveDemo();render()}return;
}
if(a==='rejectCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='pending'){c.status='rejected';saveDemo();render()}return;
}
if(a==='hideCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(c){c.previousStatus=c.status;c.status='hidden';saveDemo();render()}return;
}
if(a==='restoreCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c)return;
 const hits=cubeFormCheck([c.title,c.why,c.how,c.support,c.tasks]);
 if(hits.length){c.status='pending';c.ngHits=hits}else c.status=c.previousStatus||'proposed';
 saveDemo();render();return;
}
if(a==='like'){let g=group(id);if(!g)return;const adding=!liked.has(id);g.likes+=adding?1:-1;adding?liked.add(id):liked.delete(id);render();act('detail',id);if(adding)fxReact($('#dialog [data-act="like"]')||$('[data-act="detail"][data-id="'+id+'"]'));return}
if(a==='rejectSurvey'){let q=survey(id);if(q){q.status='rejected';render()}return}
if(a==='approveName'){let n=db.pendingNames.find(x=>x.id===id);if(!n)return;let g=group(n.gid);if(g){g.name=n.name;g.hidden=false}db.pendingNames=db.pendingNames.filter(x=>x.id!==id);render();return}
if(a==='rejectName'){let n=db.pendingNames.find(x=>x.id===id);if(!n)return;let g=group(n.gid);if(g&&n.legacy){g.name='確認済みの発意';g.hidden=false}db.pendingNames=db.pendingNames.filter(x=>x.id!==id);render();return}
if(a==='approveIslandName'){let n=db.pendingIslandNames.find(x=>x.id===id);if(!n)return;let island=db.islands.find(x=>x.id===n.islandId);if(island)island.name=n.name;db.pendingIslandNames=db.pendingIslandNames.filter(x=>x.id!==id);render();return}
if(a==='rejectIslandName'){db.pendingIslandNames=db.pendingIslandNames.filter(x=>x.id!==id);render();return}
if(a==='approveSurvey'){let q=survey(id);if(q){q.status='active';if(q.start>day(0))q.start=day(0);if(q.end<day(0))q.end=day(7)}render();return}
if(a==='approveIdea'){let i=db.ideas.find(i=>i.id===id);if(!i)return;publishIdea(i);render();return}
if(a==='rejectIdea'){let i=db.ideas.find(i=>i.id===id);if(i)i.status='rejected';render();return}
if(a==='addNGWord'){let word=$('#addNGWord')?.value.trim();if(!word)return;const target=normalized(word);if(!target||[...defaultNG,...facilityNG].some(x=>normalized(x)===target)){alert('同じNGワードが登録されています');return}facilityNG.push(word.slice(0,30));saveNG();scanExistingText();cubeSanitizeExisting();render();return}
if(a==='removeNGWord'){let ix=Number(id);if(Number.isInteger(ix)&&ix>=0&&ix<facilityNG.length){facilityNG.splice(ix,1);saveNG();render()}return}
if(a==='hideIdea'){let i=db.ideas.find(i=>i.id===id);if(i&&i.status==='approved'){i.status='hidden';let g=group(i.gid);if(g&&!db.ideas.some(x=>x.gid===g.id&&x.status==='approved'))g.hidden=true;}render();return}
if(a==='restoreIdea'){let i=db.ideas.find(i=>i.id===id);if(i&&i.status==='hidden'){const hits=findNG(i.text);i.ngHits=hits;if(hits.length){i.status='pending'}else{i.status='approved';let g=group(i.gid);if(g)g.hidden=false;}}render();return}
if(a==='archive'){let q=survey(id);if(q)q.status='archived';render();return}
if(a==='history'){let q=survey(id);if(!q)return;let li=db.ideas.filter(i=>i.sid===id&&i.status==='approved');popup(`<h3>アンケートの履歴</h3><div class="notice"><b>${safe(q.text)}</b><br>${safe(q.start)}〜${safe(q.end)}<br>承認済み ${li.length}件</div>${li.map(i=>`<div class="entry">${safe(i.text)}</div>`).join('')}`);return}
if(a==='rename'){let g=group(id);popup(`<h3>グループ名の変更</h3><div class="field"><label>グループ名</label><input id="renameText" value="${safe(g.name)}"></div><div class="actions"><button class="btn primary" data-act="saveName" data-id="${id}">変更する</button></div>`);return}
if(a==='saveName'){
 let g=group(id),name=$('#renameText')?.value.trim();if(!g||!name){$('#renameText')?.focus();return}
 const hits=findNG(name);
 if(hits.length){
  db.pendingNames=db.pendingNames.filter(x=>x.gid!==g.id||x.legacy);
  db.pendingNames.push({id:'pn'+(++seq),gid:g.id,name,ngHits:hits,legacy:false});
  saveDemo();
  popup(`<h3>グループ名を確認中です</h3><div class="notice">NGワードを検出したため、変更はまだ公開していません。現在の名前のまま職員確認待ちになります。</div><div class="actions"><button class="btn" data-act="board">ボードに戻る</button><button class="btn primary" data-act="manage">保留一覧へ</button></div>`);
 }else{g.name=name;close();render()}
 return
}}
root.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a){e.preventDefault();act(a.dataset.act,a.dataset.id);return}const r=e.target.closest('[data-role]');if(r){role=r.dataset.role;view='board';close();render();return}const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}});
root.addEventListener('change',e=>{
 if(e.target.id==='demoAccount'){const next=e.target.value;if(demoAccounts.some(x=>x.id===next)){currentAccount=next;saveAccount();close();render()}return}
 if(e.target.id==='src'){selection=e.target.value;render();return}
 if(e.target.dataset.move){let i=db.ideas.find(x=>x.id===e.target.dataset.move);if(i){i.gid=e.target.value;render()}}
});
root.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
if(typeof window!=='undefined'&&typeof window.setInterval==='function')window.setInterval(()=>{if(settleExpiredMissions())render()},60000);
})();
</script>
</div></body></html>
