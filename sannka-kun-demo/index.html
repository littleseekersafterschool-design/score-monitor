<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>SANNKA-KUN 操作モック</title></head><body style="margin:0"><div id="sk4">
<style>
#sk4{font:13px/1.6 system-ui,'Noto Sans JP',sans-serif;color:#213d3a;background:#fff}#sk4 *{box-sizing:border-box}#sk4 button,#sk4 input,#sk4 textarea,#sk4 select{font:inherit}#sk4 button{cursor:pointer}#sk4 button:focus-visible,#sk4 input:focus-visible,#sk4 textarea:focus-visible{outline:3px solid #58bfb0;outline-offset:2px}#sk4 .app{border:1px solid #deebe7;border-radius:16px;overflow:hidden;background:#fff}#sk4 header{padding:17px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e4eeea}#sk4 .brand{font-size:10px;font-weight:900;letter-spacing:1.6px;color:#08786c}#sk4 h2{margin:2px 0;font-size:22px;letter-spacing:-.6px}#sk4 .muted{font-size:11px;color:#7a918d}#sk4 .toggle{display:flex;gap:3px;border-radius:22px;background:#eaf3ef;padding:3px}#sk4 .toggle button{border:0;padding:8px 12px;border-radius:18px;background:transparent;color:#58746f;font-weight:750;font-size:11px}#sk4 .toggle button.active{background:white;color:#096d62;box-shadow:0 1px 4px #064d4030}#sk4 main{padding:15px}#sk4 .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}#sk4 .btn{background:#fff;border:1px solid #cbded9;border-radius:10px;color:#1d655b;padding:9px 12px;font-size:12px;font-weight:800;min-height:36px}#sk4 .btn.primary{background:#0f8578;border-color:#0f8578;color:#fff}#sk4 .btn.danger{color:#af4646}#sk4 .btn.small{font-size:11px;padding:7px 9px;min-height:30px}#sk4 .push{flex:1}#sk4 .map{background:#f8fbfa;background-image:radial-gradient(#dae7e2 0.8px,transparent 0.8px);background-size:19px 19px;border:1px solid #dfeae5;border-radius:15px;min-height:430px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}#sk4 .group{border:1px dashed var(--line);background:var(--wash);border-radius:40px;min-height:185px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:10px;padding:15px}#sk4 .group.free{grid-column:1/-1;min-height:165px}
#sk4 .island{position:relative;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;padding:21px 17px;min-height:120px;border:2px dashed #76b7a6;background:rgba(255,255,255,.8);border-radius:75px;box-shadow:0 3px 11px rgba(17,113,99,.07)}
#sk4 .island:hover{border-color:#248f7b;background:#fff}
#sk4 .island-label{position:absolute;top:-12px;left:15px;border:1px solid #a4d4c6;background:#fff;color:#276a5f;border-radius:99px;padding:2px 10px;font-size:10px;line-height:1.6;white-space:nowrap;font-weight:800;max-width:calc(100% - 30px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(29,110,92,.10);pointer-events:none;opacity:1}
#sk4 .island .bubble{flex:none}#sk4 .qnode{background:#0f8275;color:#fff;border:0;border-radius:50%;width:79px;height:79px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:850;flex:none}#sk4 .qnode b{font-size:24px;line-height:1.2}#sk4 .bubble{border-radius:50%;width:var(--sz);height:var(--sz);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3px;line-height:1.3;padding:8px;border:2px solid var(--line);background:var(--bg);color:var(--fg);flex:none;transition:transform .2s,background .2s}#sk4 .bubble:hover,#sk4 .qnode:hover{transform:scale(1.04)}#sk4 .bubble b{font-size:12px}#sk4 .bubble small{font-weight:800;font-size:11px}#sk4 .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}#sk4 .legend span{font-size:10px;color:#607976;display:flex;align-items:center;gap:4px}#sk4 .sw{width:11px;height:11px;border-radius:50%;border:1px solid #b6c9c3}#sk4 .panel{border:1px solid #dfeae5;border-radius:14px;padding:16px}#sk4 .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}#sk4 .tabs button{border-radius:9px;border:1px solid #d8e7e1;background:#fff;padding:8px 10px;color:#607b76;font-size:11px}#sk4 .tabs button.sel{background:#e7f4ef;color:#116b5d;border-color:#88bcad;font-weight:800}#sk4 .entry{padding:11px 0;border-bottom:1px solid #e8eeeb;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}#sk4 .entry:last-child{border-bottom:0}#sk4 .entry b{font-size:12px}#sk4 .mini{font-size:10px;color:#748d86}#sk4 .field{display:grid;gap:6px;margin:12px 0}#sk4 .field label{font-size:12px;font-weight:750}#sk4 .field input,#sk4 .field select,#sk4 .field textarea{background:#fff;color:#203b37;border:1px solid #ccded7;padding:11px;border-radius:9px;width:100%;font-size:13px}#sk4 .field textarea{min-height:100px;resize:vertical}#sk4 .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}#sk4 .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}#sk4 .overlay{position:fixed;inset:0;z-index:999;background:#0a302ebd;display:flex;align-items:center;justify-content:center;padding:14px}#sk4 .modal{background:white;border-radius:17px;padding:21px;width:min(480px,100%);max-height:85vh;overflow:auto;box-shadow:0 15px 50px #12342b50}#sk4 .modal h3{font-size:20px;margin:8px 0 10px}#sk4 .modalHead{display:flex;justify-content:space-between;align-items:center}#sk4 .notice{border:1px solid #bbe4d2;background:#eef9f3;padding:12px 13px;border-radius:10px;font-size:12px}#sk4 .foot{font-size:10px;color:#7d928e;margin-top:11px}#sk4 .empty{padding:23px;text-align:center;color:#79928d}#sk4 select.sm{padding:7px;border-radius:8px;border:1px solid #c8d9d3;background:#fff;max-width:160px;font-size:11px}
@media(max-width:530px){#sk4 .map{grid-template-columns:1fr}#sk4 .group.free{grid-column:auto}#sk4 .two{grid-template-columns:1fr}#sk4 .bubble{width:calc(var(--sz)*.86);height:calc(var(--sz)*.86)}#sk4 .group{min-height:165px}#sk4 .app{border-radius:11px}}

#sk4 .cube-mark{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#e8e4ff;color:#6a4ea2;line-height:1;font-size:13px}
#sk4 .bubble-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;min-width:74px}
#sk4 .cube-mini{border:1.6px solid #bbaee8;background:#f4f0ff;color:#5b468b;border-radius:12px;padding:3px;font-size:16px;font-weight:850;display:inline-flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.12;flex:none;box-shadow:0 2px 8px rgba(89,72,144,.08);transition:width .25s,height .25s,transform .18s}.cube-mini small{font-size:9px;font-weight:800}.cube-mini:hover{transform:translateY(-3px)}
#sk4 .cube-mini.mission{background:#fff3de;border-color:#f1be69;color:#9c5d13}
#sk4 .cube-mini.popped{background:#e9f8ef;border-color:#9bd9b5;color:#187347}
#sk4 .cube-card{border:1px solid #ded7f6;border-radius:15px;padding:13px;background:linear-gradient(135deg,#fff,#f6f2ff);box-shadow:0 3px 12px #36215c0a;margin-top:9px}
#sk4 .cube-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
#sk4 .cube-title{font-size:14px;font-weight:850}
#sk4 .cube-status{border-radius:999px;padding:3px 9px;font-size:10px;background:#e8e4f8;color:#674c9b;font-weight:750;white-space:nowrap}
#sk4 .cube-status.mission{background:#ffedcc;color:#a36514}
#sk4 .cube-status.popped,#sk4 .cube-status.progress,#sk4 .cube-status.done{background:#ddf5e8;color:#1c7a55}
#sk4 .meter{border-radius:20px;background:#e2e7e6;height:12px;overflow:hidden;border:1px solid #d6e2de;margin:10px 0 5px}
#sk4 .meter > span{display:block;height:100%;background:linear-gradient(90deg,#14a48d,#62cfb3);border-radius:20px;transition:width .3s}
#sk4 .mission-banner{background:linear-gradient(110deg,#e8f7f4,#fff3d5);border:1px solid #b8ded4;border-radius:14px;padding:12px 14px;margin-bottom:13px}
#sk4 .mission-items{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#sk4 .mission-entry{flex:1;min-width:180px;background:#fffdf8;border:1px solid #e2d8c5;border-radius:11px;padding:9px;text-align:left}
#sk4 .mission-entry b{display:block;font-size:12px}
#sk4 .mission-entry span{font-size:10px;color:#67857c}
#sk4 .cube-emoji{font-size:22px;line-height:1}
#sk4 .pop-scene{text-align:center;background:radial-gradient(circle,#e4faeb,#e9f5ff);border:1px solid #a9ded0;border-radius:18px;padding:25px 12px;margin:14px 0;animation:skPop .6s ease-out}
#sk4 .pop-scene .big-pop{font-size:42px;font-weight:950;color:#08786c;letter-spacing:2px}
@keyframes skPop{0%{transform:scale(.55);opacity:.1}65%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
#sk4 .inline-info{font-size:11px;color:#67847d;line-height:1.65}
#sk4 .badge{border-radius:999px;background:#f0f7f5;padding:3px 8px;font-size:10px;color:#3d776a;font-weight:750}
#sk4 .cube-link{display:inline-flex;gap:5px;align-items:center}
@media(max-width:530px){#sk4 .bubble-wrap{min-width:65px}#sk4 .cube-mini{font-size:9px;max-width:110px}}

/* Bubble World：泡の透明感を持つ青系の世界観。常時の動きは控えめ。 */
#sk4{background:#f6fbff;color:#1b3e58}
#sk4 .app{border-color:#d9eaf7;background:linear-gradient(180deg,#ffffff,#f8fcff)}
#sk4 header{background:linear-gradient(110deg,#fff 50%,#eef9ff);border-color:#dbeaf3}
#sk4 .brand{color:#1268a8}
#sk4 .brand-row{display:flex;align-items:center;gap:10px}
#sk4 .brand-avatar{width:43px;height:43px;flex:none;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(32,122,195,.16))}
#sk4 .brand-caption{font-size:10px;font-weight:800;letter-spacing:.07em;color:#1474bb}
#sk4 h2{color:#174966}
#sk4 .map{background-color:#f5fbff;background-image:radial-gradient(ellipse at 18% 12%,rgba(180,229,255,.22),transparent 48%),radial-gradient(ellipse at 84% 74%,rgba(99,190,245,.12),transparent 55%),radial-gradient(#cee5f5 0.8px,transparent 0.8px);background-size:auto,auto,19px 19px;border-color:#d6e8f4}
#sk4 .group{border-color:#afd4ed !important;background:rgba(221,244,255,.28) !important}
#sk4 .group.free{background:rgba(219,246,255,.38) !important}
#sk4 .island{border-color:#83c3e6;background:rgba(255,255,255,.74);box-shadow:0 5px 15px rgba(56,139,210,.08)}
#sk4 .island-label{border-color:#b2d9ee;color:#146797;box-shadow:0 2px 10px rgba(62,128,197,.12)}
#sk4 .qnode{background:linear-gradient(135deg,#22a8d0,#117ead);box-shadow:0 4px 11px rgba(14,127,189,.19)}
/* Survey question: always-visible, compact label inspired by the reference board UI */
#sk4 .survey-head{flex:0 0 100%;display:flex;align-items:center;justify-content:flex-start;gap:7px;margin:-2px 0 7px;order:-1;min-width:0}
#sk4 .survey-question{display:flex;align-items:center;gap:5px;min-width:0;max-width:calc(100% - 92px);border:1px solid #a9d3eb;background:rgba(239,249,255,.96);color:#174f72;border-radius:10px;padding:4px 9px 4px 5px;box-shadow:0 2px 7px rgba(46,125,177,.08)}
#sk4 .survey-mini-icon{width:27px;height:27px;min-width:27px;border-radius:8px;background:linear-gradient(135deg,#22a8d0,#117ead);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:900;line-height:1}
#sk4 .survey-mini-icon b{font-size:8px;line-height:1}
#sk4 .survey-question small{display:inline;color:#4281a6;font-size:9px;font-weight:850;letter-spacing:.03em;white-space:nowrap}
#sk4 .survey-question strong{display:block;min-width:0;font-size:12px;line-height:1.35;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sk4 .survey-answer{border:1px solid #b5d6e8;background:#fff;color:#1e739f;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:850;white-space:nowrap;transition:background .18s,border-color .18s,transform .18s}
#sk4 .survey-answer:hover{background:#eaf7ff;border-color:#75badd;transform:translateY(-1px)}
@media(max-width:530px){#sk4 .survey-head{align-items:flex-start;flex-wrap:wrap}#sk4 .survey-question{flex:1;max-width:none}#sk4 .survey-question strong{font-size:11px;white-space:normal}#sk4 .survey-answer{margin-left:34px}}

#sk4 .bubble{position:relative;isolation:isolate;overflow:hidden;border-color:var(--line);background:radial-gradient(circle at 29% 19%,rgba(255,255,255,.94),rgba(255,255,255,.33) 24%,transparent 53%),var(--bg);box-shadow:inset 5px 7px 12px rgba(255,255,255,.42),inset -9px -10px 17px rgba(12,88,159,.13),0 7px 16px rgba(40,123,190,.15);animation:skFloat 5.7s ease-in-out infinite}
#sk4 .bubble::before{content:"";position:absolute;left:19%;top:13%;width:37%;height:14%;background:rgba(255,255,255,.58);border-radius:60%;transform:rotate(-30deg);pointer-events:none;z-index:-1}
#sk4 .bubble:hover{transform:translateY(-3px) scale(1.055);box-shadow:inset 4px 6px 12px rgba(255,255,255,.45),0 9px 22px rgba(31,135,207,.27)}
#sk4 .bubble-wrap:nth-child(2n) .bubble{animation-delay:-1.8s}
#sk4 .bubble-wrap:nth-child(3n) .bubble{animation-delay:-3.1s}
#sk4 .bubble.sk-react{animation:skBubbleGrow .9s cubic-bezier(.19,1.3,.28,1.2) 1}
#sk4 .cube-mini{border-color:#a7c8fa;background:linear-gradient(140deg,#fff,#d9e9ff);color:#294d91;box-shadow:inset 2px 2px 7px rgba(255,255,255,.8),0 4px 12px rgba(81,133,201,.12)}
#sk4 .cube-mini.sk-react{animation:skBubbleGrow .8s cubic-bezier(.18,1.2,.25,1) 1}
#sk4 .mission-banner{background:linear-gradient(115deg,#e0f5ff,#eefaf7 65%,#fff7e3);border-color:#b4def0}
#sk4 .pop-scene{position:relative;overflow:hidden;background:radial-gradient(circle at 47% 40%,#fff,#d6f4ff 62%,#c2eafd);border-color:#96d7ef}
#sk4 .pop-scene .big-pop{position:relative;z-index:2;animation:skPopHeadline 1.15s cubic-bezier(.2,1.3,.3,1)}
#sk4 .sk-confetti{position:absolute;left:50%;top:42%;height:12px;width:12px;opacity:0;border-radius:50%;background:var(--pbg,#7ac7f2);pointer-events:none;animation:skConfetti 1.55s cubic-bezier(.12,.65,.32,1) var(--delay,0s) 1 both}
#sk4 .sk-confetti.star{clip-path:polygon(50% 0%,61% 34%,96% 35%,68% 56%,79% 91%,50% 71%,21% 91%,32% 56%,4% 35%,39% 34%);border-radius:0}
#sk4 .sk-float-heart{position:fixed;z-index:1800;pointer-events:none;color:#fa538c;text-shadow:0 2px 8px rgba(248,67,115,.25);font-size:20px;animation:skHeartRise 1.2s ease-out forwards}
@keyframes skFloat{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes skBubbleGrow{0%{scale:.92;filter:brightness(1)}45%{scale:1.12;filter:brightness(1.18)}100%{scale:1;filter:brightness(1)}}
@keyframes skHeartRise{0%{opacity:0;transform:translate(0,4px) scale(.7)}18%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,-65px)) scale(1.15)}}
@keyframes skPopHeadline{0%{transform:scale(.4);opacity:0}55%{transform:scale(1.21)}100%{transform:scale(1);opacity:1}}
@keyframes skConfetti{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1}100%{opacity:0;transform:translate(var(--px),var(--py)) rotate(var(--spin,120deg)) scale(1.05)}}
@media(prefers-reduced-motion:reduce){#sk4 .bubble,#sk4 .bubble.sk-react,#sk4 .cube-mini.sk-react,#sk4 .pop-scene,#sk4 .pop-scene .big-pop,#sk4 .sk-confetti,#sk4 .sk-float-heart{animation:none !important;transition:none !important}#sk4 .sk-confetti,#sk4 .sk-float-heart{display:none}}


/* Power to Pop はボードではなくアカウントへのメール型通知 */
#sk4 .user-select{font-size:11px;font-weight:800;padding:7px 10px;border-radius:10px;border:1px solid #a9d7e9;background:white;color:#1d607f;max-width:165px}
#sk4 .inbox-count{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:12px;padding:0 4px;background:#ef5d77;color:white;font-size:10px;font-weight:900}
#sk4 .mail-grid{display:grid;gap:11px}
#sk4 .mail-item{display:flex;width:100%;align-items:center;gap:13px;text-align:left;padding:15px 14px;border:1px solid #cfe2ef;background:#fff;border-radius:13px;color:#204e67}
#sk4 .mail-item.unread{background:linear-gradient(110deg,#effaff,#fff);border-color:#70bddd;box-shadow:0 3px 15px #45a4d71f}
#sk4 .mail-item:hover{border-color:#339ccc;transform:translateY(-1px)}
#sk4 .mail-envelope{font-size:26px;flex:none}
#sk4 .mail-subject{font-size:14px;font-weight:850;color:#175d8b}
#sk4 .mail-preview{font-size:11px;color:#6c8490;line-height:1.65}
#sk4 .vote-choice{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #d6e8f1;border-radius:11px;margin:8px 0;background:white;cursor:pointer}
#sk4 .vote-choice:has(input:checked){border-color:#57a7d6;background:#eaf7ff}
#sk4 .vote-choice input{width:19px;height:19px;accent-color:#1289c3;flex:none}
#sk4 .vote-choice b{font-size:13px}
#sk4 .vote-stats{border-radius:12px;background:#ebf7ff;padding:12px;margin:10px 0;color:#176281;font-size:12px;font-weight:750}
#sk4 .rank-row{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:10px;border:1px solid #dae8f0;border-radius:10px;margin:7px 0;background:white}
#sk4 .rank-row b{font-size:13px}
#sk4 .result-badge{background:#def8ef;color:#0c7857;font-weight:850;border-radius:99px;padding:3px 9px;font-size:10px}
#sk4 .result-podium{display:flex;align-items:center;gap:12px;border:1px solid #a9d8eb;border-radius:13px;background:linear-gradient(130deg,#f0fbff,#e7f9f4);padding:12px;margin-top:10px}
#sk4 .triangle-symbol{display:grid;place-items:center;flex:none;width:64px;height:60px;clip-path:polygon(50% 1%,99% 94%,1% 94%);background:linear-gradient(150deg,#00a5eb,#307bc9,#ffcf64);color:#fff;font-weight:950;text-shadow:0 1px 4px #075e90}
#sk4 .cube-mini.project{clip-path:polygon(50% 0%,98% 94%,2% 94%);border-radius:0;border:none;background:linear-gradient(155deg,#0c9dd7,#2073d4,#ffd267);color:#fff;box-shadow:none}
#sk4 .cube-mini.project small{color:#fff}
#sk4 .square-to-triangle{margin:0 auto;display:grid;place-items:center;width:92px;height:92px;border-radius:16px;background:linear-gradient(150deg,#85d4ff,#297bc6);font-size:30px;color:white;font-weight:950;animation:skMorph 1.45s cubic-bezier(.22,1,.28,1) forwards}
#sk4 .result-scene{text-align:center;border:1px solid #a9d9ea;border-radius:17px;padding:23px 12px;background:radial-gradient(circle,#fff,#d6efff);position:relative;overflow:hidden}
#sk4 .result-scene h3{margin:13px auto 7px;color:#1d6495}
@keyframes skMorph{0%{border-radius:15px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:scale(.85) rotate(-8deg)}50%{transform:scale(1.12) rotate(13deg)}100%{clip-path:polygon(50% 0%,100% 95%,0 95%);transform:scale(1) rotate(0);border-radius:0}}
@media(prefers-reduced-motion:reduce){#sk4 .square-to-triangle{animation:none;clip-path:polygon(50% 0%,100% 95%,0 95%)}}

#sk4 .vote-stepper{display:flex;align-items:center;gap:8px}
#sk4 .vote-stepper b{font-size:18px;min-width:23px;text-align:center;color:#126a9f}
#sk4 .vote-stepper button{width:34px;height:34px;padding:2px;display:inline-grid;place-items:center;border-radius:50%}
#sk4 .vote-stepper button:disabled{opacity:.37;cursor:not-allowed}
#sk4 .mail-vote-allocations{margin-top:10px}

#sk4 .map{position:relative}
#sk4 .cube-mini.cube-evolving{animation:skCubeTransform 1.35s cubic-bezier(.17,1.15,.32,1) both;transform-origin:50% 50%}
#sk4 .pop-board-note{position:absolute;z-index:8;left:50%;top:11px;transform:translateX(-50%);width:min(95%,430px);background:#e3f6ff;border:1px solid #71c7e9;color:#155b8a;box-shadow:0 10px 30px #2c94c82b;border-radius:16px;text-align:center;padding:10px 14px;font-size:13px;font-weight:900}
#sk4 .pop-board-note[hidden]{display:none}
@keyframes skCubeTransform{0%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:scale(.88) rotate(-10deg);border-radius:12px;filter:brightness(1)}40%{transform:scale(1.18) rotate(12deg);filter:brightness(1.2)}100%{clip-path:polygon(50% 0,98% 94%,2% 94%);transform:scale(1) rotate(0);border-radius:0;filter:brightness(1)}}
@media(prefers-reduced-motion:reduce){#sk4 .cube-mini.cube-evolving{animation:none;clip-path:polygon(50% 0,98% 94%,2% 94%)}}

/* 重ね合わせ：Bubble の下端にキューブ／三角を少し掛ける */
#sk4 .bubble-wrap{position:relative;display:flex;align-items:flex-start;justify-content:flex-start;flex-direction:column;min-width:var(--anchor-size,74px);padding:0 12px 26px 0;isolation:isolate}
#sk4 .bubble-wrap>.bubble{position:relative;z-index:1}
#sk4 .bubble-wrap>.cube-mini{position:absolute;z-index:2;top:calc(var(--anchor-size,74px) * .67);right:-5px;transform-origin:50% 50%;box-shadow:0 4px 10px rgba(28,122,195,.15)}
#sk4 .bubble-wrap>.cube-mini:nth-child(3){right:27px;top:calc(var(--anchor-size,74px) * .77);z-index:3}
#sk4 .bubble-wrap>.cube-mini:nth-child(n+4){right:45px;top:calc(var(--anchor-size,74px) * .88);z-index:4}
#sk4 .bubble-wrap>.cube-mini:hover{transform:translateY(-4px) scale(1.04)}
#sk4 .persistent-projects{grid-column:1/-1;min-width:0;border:1px solid #c9e0ef;background:linear-gradient(110deg,#f6fbff,#effaff);border-radius:15px;margin-top:13px;padding:13px 13px 10px}
#sk4 .persistent-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 11px;color:#23668b;font-size:12px}
#sk4 .persist-island-row{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
#sk4 .persist-island{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;position:relative;border:2px dashed #84c3e4;border-radius:64px;background:#fff;padding:22px 15px 10px;min-height:112px;max-width:100%}
#sk4 .persist-island .island-label{opacity:1}
#sk4 .residual-scroll{display:flex;gap:10px;overflow-x:auto;overflow-y:visible;padding:9px 8px 0;scroll-snap-type:x proximity}
#sk4 .residual-pair{flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid #d4e9f5;background:rgba(255,255,255,.9);border-radius:24px;padding:12px 10px 3px;min-width:120px;scroll-snap-align:start}
#sk4 .residual-pair .bubble-wrap{margin:0 auto}
@media(max-width:530px){#sk4 .bubble-wrap{padding-bottom:27px}#sk4 .persist-island-row{display:flex;flex-direction:column}#sk4 .persist-island{max-width:100%}}

/* BubbleとCube/認定Triangleの重なりをピクセル単位で固定。
   calc(length * number) は端末ごとの互換差があるため使わない。 */
#sk4 .bubble-wrap{
  display:block;
  position:relative;
  flex:0 0 auto;
  align-self:center;
  box-sizing:border-box;
  width:calc(var(--bubble-size,90px) + 30px);
  height:calc(var(--bubble-size,90px) + 30px);
  min-width:0;
  min-height:0;
  padding:0;
  margin:0;
  isolation:isolate;
  overflow:visible;
}
#sk4 .bubble-wrap>.bubble{
  position:absolute;
  left:0;
  top:0;
  width:var(--bubble-size,90px);
  height:var(--bubble-size,90px);
  z-index:1;
}
#sk4 .bubble-wrap>.cube-mini{
  position:absolute;
  left:calc(var(--bubble-size,90px) - 28px);
  top:calc(var(--bubble-size,90px) - 35px);
  right:auto;
  bottom:auto;
  z-index:3;
  margin:0;
  padding:3px;
  transform-origin:40% 35%;
}
#sk4 .bubble-wrap>.cube-mini:nth-child(3){
  left:calc(var(--bubble-size,90px) - 55px);
  top:calc(var(--bubble-size,90px) - 22px);
  right:auto;
  z-index:4;
}
#sk4 .bubble-wrap>.cube-mini:nth-child(n+4){
  left:calc(var(--bubble-size,90px) - 78px);
  top:calc(var(--bubble-size,90px) - 12px);
  right:auto;
  z-index:5;
}
#sk4 .bubble-wrap>.cube-mini:hover{transform:translateY(-3px) scale(1.05)}
#sk4 .residual-pair .bubble-wrap{align-self:center;margin:0}
@media(max-width:530px){
  #sk4 .bubble-wrap>.bubble{width:var(--bubble-size,90px);height:var(--bubble-size,90px)}
  #sk4 .bubble-wrap{padding:0;height:calc(var(--bubble-size,90px) + 30px)}
}

/* AI keyword search board */
#sk4 .ai-search-btn{border-color:#9dcbea;background:linear-gradient(135deg,#f7fcff,#e8f6ff);color:#136b9f}
#sk4 .search-shell{border:1px solid #d5e8f5;border-radius:18px;background:linear-gradient(180deg,#fff,#f5fbff);padding:18px}
#sk4 .search-title-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
#sk4 .search-title-row h3{font-size:21px;color:#174f72;margin:3px 0}
#sk4 .search-title-row p{margin:0;color:#68859a;font-size:12px}
#sk4 .ai-kicker{font-size:9px;letter-spacing:.12em;font-weight:900;color:#2184bd}
#sk4 .ai-badge{border:1px solid #acd8ef;background:#e8f7ff;color:#126a9c;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:850;white-space:nowrap}

#sk4 .search-summary>div{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #d5e7f1;background:#fff;border-radius:13px;padding:9px}
#sk4 .search-summary b{font-size:18px;color:#155f8b}
#sk4 .search-summary span{font-size:9px;color:#7893a4;font-weight:750}
#sk4 .ai-note{display:flex;gap:10px;align-items:flex-start;border:1px solid #b9deec;background:linear-gradient(110deg,#eaf8ff,#f7fdff);border-radius:14px;padding:11px 13px;margin:12px 0;color:#345d75}
#sk4 .ai-note b{color:#126a9c;white-space:nowrap;font-size:11px}
#sk4 .ai-note span{font-size:11px}
#sk4 .search-map{border:1px solid #d6e9f4;border-radius:20px;padding:20px 15px;background:radial-gradient(circle at 50% 12%,rgba(172,225,255,.38),transparent 34%),radial-gradient(#d5e8f5 .8px,transparent .8px),#f8fcff;background-size:auto,19px 19px;min-height:320px}
#sk4 .search-core{width:118px;height:118px;border-radius:50%;margin:0 auto 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 30% 20%,#fff,#bfe9ff 52%,#80c9ed);border:2px solid #72bee4;color:#164f70;box-shadow:0 9px 24px rgba(39,137,190,.18)}
#sk4 .search-core small,#sk4 .search-core span{font-size:9px;color:#3c7798;font-weight:800}
#sk4 .search-core b{font-size:19px;line-height:1.35;max-width:94px;word-break:break-word}
#sk4 .search-cloud{display:flex;justify-content:center;align-items:flex-start;gap:18px;flex-wrap:wrap}
#sk4 .search-hit{position:relative;width:148px;min-height:174px;padding:25px 8px 9px;border:1px solid rgba(166,207,231,.72);border-radius:44% 56% 48% 52%/58% 44% 56% 42%;background:rgba(255,255,255,.67);display:flex;flex-direction:column;align-items:center;justify-content:center}
#sk4 .search-hit .bubble-wrap{min-width:0}
#sk4 .search-match{position:absolute;top:7px;left:50%;transform:translateX(-50%);border-radius:999px;background:#e8f7ff;color:#1b79aa;font-size:9px;font-weight:850;padding:2px 8px;white-space:nowrap}
#sk4 .search-source{margin-top:7px;text-align:center;color:#6b8799;font-size:9px;line-height:1.45;max-width:132px}
#sk4 .search-disclaimer{margin-top:10px;color:#8297a5;font-size:9px;text-align:center}
@media(max-width:530px){#sk4 .search-shell{padding:14px}#sk4 .search-form{flex-wrap:wrap}#sk4 .search-form .btn{width:100%}#sk4 .ai-note{display:block}#sk4 .ai-note b{display:block;margin-bottom:3px}#sk4 .search-hit{width:138px}}


#sk4 .board-rule{margin-top:9px;border:1px solid #d7e7f0;background:#f7fbfe;color:#607f92;border-radius:10px;padding:7px 10px;font-size:9px;text-align:center}

function semanticLexicon(query){
  const q=normalized(query);
  const concepts=[
    ['遊び','あそび','サッカー','フットサル','ボール','ゲーム','switch','スイッチ','鬼ごっこ','おにごっこ','お祭り','祭り','秘密基地','虫取り'],
    ['食べ物','食べる','食事','料理','ごはん','お菓子','おかし','クッキー','ケーキ','おやつ'],
    ['生き物','生物','動物','虫','昆虫','魚','水槽','金魚','捕る','飼う','虫取り'],
    ['ものづくり','工作','作る','つくる','段ボール','ダンボール','秘密基地','アイロンビーズ'],
    ['運動','スポーツ','体を動かす','サッカー','フットサル','ボール','鬼ごっこ'],
    ['イベント','行事','大会','お祭り','祭り','みんなで']
  ];
  const terms=new Set(q?[q]:[]);
  for(const words of concepts){
    const normalizedWords=words.map(normalized);
    if(normalizedWords.some(w=>q&&((q.includes(w))||(w.includes(q))))){
      for(const w of normalizedWords)terms.add(w);
    }
  }
  return [...terms].filter(Boolean);
}
function semanticResults(query){
  const q=normalized(query),terms=semanticLexicon(query);
  if(!q)return [];
  return db.groups.filter(g=>{
    if(g.hidden||groupCount(g.id)===0||shouldBeResidual(g))return false;
    if(g.sid!==null&&g.sid!==undefined){const s=survey(g.sid);if(!s||!active(s))return false}
    return true;
  }).map(g=>{
    const ideas=db.ideas.filter(i=>i.gid===g.id&&i.status==='approved');
    const source=g.sid?survey(g.sid):null;
    const haystack=normalized([g.name,...ideas.map(i=>i.text),source?.text||''].join(' '));
    let score=haystack.includes(q)?80:0;
    for(const term of terms)if(term!==q&&haystack.includes(term))score+=14;
    if(!score)return null;
    return {g,ideas,source,score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score||b.g.likes-a.g.likes);
}

  p.style.setProperty('--dx',((i-2)*27)+'px');p.style.setProperty('--dy',(-56-(i%3)*22)+'px');

function fxDecoratePop(scene){

 const colors=['#7dd3fc','#249cdf','#e7f9ff','#ffe28a','#67bdb3','#a1dcff','#3d8ddd'];
 for(let i=0;i<18;i++){
  const p=document.createElement('span'),a=(i/18)*Math.PI*2,dist=65+(i%4)*26;

  p.style.setProperty('--delay',(i%4)*.04+'s');p.style.setProperty('--spin',(i*53)+'deg');p.style.setProperty('--pbg',colors[i%colors.length]);
  scene.appendChild(p);
 }

}
if(a==='markDone'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='progress'){c.status='done';saveDemo();render()}return;
}
if(a==='taskEdit'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c)return;
 popup(`<h3>実行の役割・施設のサポート</h3><div class="notice">${safe(c.title)}</div><div class="field"><label>役割分担・準備・サポート</label><textarea id="cubeTasks" maxlength="400" placeholder="担当や準備、安全確認などを入力">${safe(c.tasks||'')}</textarea></div><div class="actions"><button class="btn primary" data-act="taskSave" data-id="${safe(c.id)}">保存する</button></div>`);return;
}
if(a==='taskSave'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c)return;
 const tasks=$('#cubeTasks')?.value.trim()||'';const hits=findNG(tasks);
 if(hits.length){popup('<h3>確認が必要な表現があります</h3><div class="notice">NGワードを検出したため、公開用の支援内容を保存しませんでした。表現を確認してください。</div><div class="actions"><button class="btn" data-act="cubeDetail" data-id="'+id+'">戻る</button></div>');return}
 c.tasks=tasks;saveDemo();close();render();return;
}
if(a==='approveCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='pending'){c.status='proposed';saveDemo();render()}return;
}
if(a==='rejectCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='pending'){c.status='rejected';saveDemo();render()}return;
}
if(a==='hideCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(c){c.previousStatus=c.status;c.status='hidden';saveDemo();render()}return;
}
if(a==='restoreCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c)return;
 const hits=cubeFormCheck([c.title,c.why,c.how,c.support,c.tasks]);
 if(hits.length){c.status='pending';c.ngHits=hits}else c.status=c.previousStatus||'proposed';
 saveDemo();render();return;
}
if(a==='like'){let g=group(id);if(!g)return;const adding=!liked.has(id);g.likes+=adding?1:-1;adding?liked.add(id):liked.delete(id);render();act('detail',id);if(adding)fxReact($('#dialog [data-act="like"]')||$('[data-act="detail"][data-id="'+id+'"]'));return}
if(a==='rejectSurvey'){let q=survey(id);if(q){q.status='rejected';render()}return}
if(a==='approveSurvey'){let q=survey(id);if(q){q.status='active';if(q.start>day(0))q.start=day(0);if(q.end<day(0))q.end=day(7)}render();return}
if(a==='approveIdea'){let i=db.ideas.find(i=>i.id===id&&i.status==='pending');if(!i)return;publishIdea(i);render();return}
if(a==='rejectIdea'){let i=db.ideas.find(i=>i.id===id&&i.status==='pending');if(i)i.status='rejected';render();return}
if(a==='addNGWord'){let word=$('#addNGWord')?.value.trim();if(!word)return;const target=normalized(word);if(!target||[...defaultNG,...facilityNG].some(x=>normalized(x)===target)){alert('同じNGワードが登録されています');return}facilityNG.push(word.slice(0,30));saveNG();scanExistingText();cubeSanitizeExisting();render();return}
if(a==='removeNGWord'){let ix=Number(id);if(Number.isInteger(ix)&&ix>=0&&ix<facilityNG.length){facilityNG.splice(ix,1);saveNG();render()}return}
if(a==='hideIdea'){let i=db.ideas.find(i=>i.id===id);if(i&&i.status==='approved'){i.status='hidden';let g=group(i.gid);if(g&&!db.ideas.some(x=>x.gid===g.id&&x.status==='approved'))g.hidden=true;}render();return}
if(a==='restoreIdea'){let i=db.ideas.find(i=>i.id===id);if(i&&i.status==='hidden'){const hits=findNG(i.text);i.ngHits=hits;if(hits.length){i.status='pending'}else{i.status='approved';let g=group(i.gid);if(g)g.hidden=false;}}render();return}
if(a==='deleteSurvey'){
 if(role!=='staff')return;
 const q=survey(id);if(!q)return;
 const answerCount=db.ideas.filter(i=>i.sid===id).length;
 const linkedGroups=db.groups.filter(g=>g.sid===id),linkedGroupIds=new Set(linkedGroups.map(g=>g.id));
 const cubeCount=(db.cubes||[]).filter(c=>linkedGroupIds.has(c.gid)).length;
 popup(`<h3>この問いかけを削除しますか？</h3><div class="notice"><b>${safe(q.text)}</b></div><p class="inline-info">この問いかけに紐づく回答 ${answerCount}件、バブル ${linkedGroups.length}件${cubeCount?`、キューブ ${cubeCount}件`:''}も削除されます。この操作は元に戻せません。</p><div class="actions"><button class="btn" data-act="close">キャンセル</button><button class="btn danger" data-act="confirmDeleteSurvey" data-id="${safe(q.id)}">削除する</button></div>`);
 return;
}
if(a==='confirmDeleteSurvey'){
 if(role!=='staff')return;
 const q=survey(id);if(!q){close();render();return}
 const title=q.text,result=deleteSurveyData(id);
 close();view='manage';tab='surveys';render();
 popup(`<h3>問いかけを削除しました</h3><div class="notice"><b>${safe(title)}</b><br>関連する回答 ${result.ideas}件も削除しました。</div><div class="actions"><button class="btn primary" data-act="close">閉じる</button></div>`);
 return;
}
if(a==='archive'){let q=survey(id);if(q){q.status='archived';q.archivedAt=new Date().toISOString()}render();return}
if(a==='history'){let q=survey(id);if(!q)return;let li=db.ideas.filter(i=>i.sid===id&&i.status==='approved');popup(`<h3>アンケートの履歴</h3><div class="notice"><b>${safe(q.text)}</b><br>${safe(q.start)}〜${safe(q.end)}<br>承認済み ${li.length}件</div>${li.map(i=>`<div class="entry">${safe(i.text)}</div>`).join('')}`);return}
}
root.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a){e.preventDefault();act(a.dataset.act,a.dataset.id);return}const r=e.target.closest('[data-role]');if(r){role=r.dataset.role;view='board';close();render();return}const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}});
root.addEventListener('change',e=>{
 if(e.target.id==='demoAccount'){const next=e.target.value;if(demoAccounts.some(x=>x.id===next)){currentAccount=next;saveAccount();close();render()}return}
});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='semanticQuery'){e.preventDefault();act('runSearch');return}if(e.key==='Escape')close()});
render();
if(typeof window!=='undefined'&&typeof window.setInterval==='function')window.setInterval(()=>{if(settleExpiredMissions()||expireSurveys())render()},60000);
})();
</script>
</div></body></html>
