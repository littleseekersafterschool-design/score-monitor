<style>
#sk4{font:13px/1.6 system-ui,'Noto Sans JP',sans-serif;color:#213d3a;background:#fff}#sk4 *{box-sizing:border-box}#sk4 button,#sk4 input,#sk4 textarea,#sk4 select{font:inherit}#sk4 button{cursor:pointer}#sk4 button:focus-visible,#sk4 input:focus-visible,#sk4 textarea:focus-visible{outline:3px solid #58bfb0;outline-offset:2px}#sk4 .app{border:1px solid #deebe7;border-radius:16px;overflow:hidden;background:#fff}#sk4 header{padding:17px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e4eeea}#sk4 .brand{font-size:10px;font-weight:900;letter-spacing:1.6px;color:#08786c}#sk4 h2{margin:2px 0;font-size:22px;letter-spacing:-.6px}#sk4 .muted{font-size:11px;color:#7a918d}#sk4 .toggle{display:flex;gap:3px;border-radius:22px;background:#eaf3ef;padding:3px}#sk4 .toggle button{border:0;padding:8px 12px;border-radius:18px;background:transparent;color:#58746f;font-weight:750;font-size:11px}#sk4 .toggle button.active{background:white;color:#096d62;box-shadow:0 1px 4px #064d4030}#sk4 main{padding:15px}#sk4 .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}#sk4 .btn{background:#fff;border:1px solid #cbded9;border-radius:10px;color:#1d655b;padding:9px 12px;font-size:12px;font-weight:800;min-height:36px}#sk4 .btn.primary{background:#0f8578;border-color:#0f8578;color:#fff}#sk4 .btn.danger{color:#af4646}#sk4 .btn.small{font-size:11px;padding:7px 9px;min-height:30px}#sk4 .push{flex:1}#sk4 .map{background:#f8fbfa;background-image:radial-gradient(#dae7e2 0.8px,transparent 0.8px);background-size:19px 19px;border:1px solid #dfeae5;border-radius:15px;min-height:430px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}#sk4 .group{border:1px dashed var(--line);background:var(--wash);border-radius:40px;min-height:185px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:10px;padding:15px}#sk4 .group.free{grid-column:1/-1;min-height:165px}

#sk4 .island:hover{border-color:#248f7b;background:#fff}

#sk4 .island .bubble{flex:none}#sk4 .qnode{background:#0f8275;color:#fff;border:0;border-radius:50%;width:79px;height:79px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:850;flex:none}#sk4 .qnode b{font-size:24px;line-height:1.2}#sk4 .bubble{border-radius:50%;width:var(--sz);height:var(--sz);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3px;line-height:1.3;padding:8px;border:2px solid var(--line);background:var(--bg);color:var(--fg);flex:none;transition:transform .2s,background .2s}#sk4 .bubble:hover,#sk4 .qnode:hover{transform:scale(1.04)}#sk4 .bubble b{font-size:12px}#sk4 .bubble small{font-weight:800;font-size:11px}#sk4 .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}#sk4 .legend span{font-size:10px;color:#607976;display:flex;align-items:center;gap:4px}#sk4 .sw{width:11px;height:11px;border-radius:50%;border:1px solid #b6c9c3}#sk4 .panel{border:1px solid #dfeae5;border-radius:14px;padding:16px}#sk4 .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}#sk4 .tabs button{border-radius:9px;border:1px solid #d8e7e1;background:#fff;padding:8px 10px;color:#607b76;font-size:11px}#sk4 .tabs button.sel{background:#e7f4ef;color:#116b5d;border-color:#88bcad;font-weight:800}#sk4 .entry{padding:11px 0;border-bottom:1px solid #e8eeeb;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}#sk4 .entry:last-child{border-bottom:0}#sk4 .entry b{font-size:12px}#sk4 .mini{font-size:10px;color:#748d86}#sk4 .field{display:grid;gap:6px;margin:12px 0}#sk4 .field label{font-size:12px;font-weight:750}#sk4 .field input,#sk4 .field select,#sk4 .field textarea{background:#fff;color:#203b37;border:1px solid #ccded7;padding:11px;border-radius:9px;width:100%;font-size:13px}#sk4 .field textarea{min-height:100px;resize:vertical}#sk4 .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}#sk4 .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}#sk4 .overlay{position:fixed;inset:0;z-index:999;background:#0a302ebd;display:flex;align-items:center;justify-content:center;padding:14px}#sk4 .modal{background:white;border-radius:17px;padding:21px;width:min(480px,100%);max-height:85vh;overflow:auto;box-shadow:0 15px 50px #12342b50}#sk4 .modal h3{font-size:20px;margin:8px 0 10px}#sk4 .modalHead{display:flex;justify-content:space-between;align-items:center}#sk4 .notice{border:1px solid #bbe4d2;background:#eef9f3;padding:12px 13px;border-radius:10px;font-size:12px}#sk4 .foot{font-size:10px;color:#7d928e;margin-top:11px}#sk4 .empty{padding:23px;text-align:center;color:#79928d}#sk4 select.sm{padding:7px;border-radius:8px;border:1px solid #c8d9d3;background:#fff;max-width:160px;font-size:11px}

#sk4 .cube-mini{border:1.6px solid #bbaee8;background:#f4f0ff;color:#5b468b;border-radius:12px;padding:3px;font-size:16px;font-weight:850;display:inline-flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.12;flex:none;box-shadow:0 2px 8px rgba(89,72,144,.08);transition:width .25s,height .25s,transform .18s}.cube-mini small{font-size:9px;font-weight:800}.cube-mini:hover{transform:translateY(-3px)}

#sk4 .pop-scene .big-pop{font-size:42px;font-weight:950;color:#08786c;letter-spacing:2px}
@keyframes skPop{0%{transform:scale(.55);opacity:.1}65%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
#sk4 .inline-info{font-size:11px;color:#67847d;line-height:1.65}

<div class="app"><header><div><div class="brand">SANNKA-KUN</div><h2>みんなの発意ボード</h2><div class="muted">Little.Seekers｜操作モック・サンプルデータ</div></div><div id="roles" class="toggle"></div></header><main><div class="toolbar" id="toolbar"></div><div id="view"></div><div class="foot">このモック内だけで動作します。実際の施設データには接続しません。</div></main></div><div id="dialog"></div>
<script>
(()=>{
const root=document.getElementById('sk4');if(!root||root.dataset.started)return;root.dataset.started='1';
const $=s=>root.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='child',view='board',tab='pending',selection='a',seq=60;
const day=n=>{let d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const palette=[['#fff','#cfdbd7','#536a65','0〜4'],['#e6f5e5','#a6d7ac','#30643d','5〜9'],['#d8f0ec','#96d1c8','#226d63','10〜14'],['#dce9ff','#a3bde9','#29568e','15〜19'],['#ecddff','#bfa6e7','#62439a','20〜24'],['#ffe1b9','#edb479','#8b581c','25〜29'],['#ffbcae','#e48b77','#862d1e','30〜35+']];
const color=n=>palette[n<=4?0:n<=9?1:n<=14?2:n<=19?3:n<=24?4:n<=29?5:6];
const db={surveys:[{id:'a',label:'A',text:'次は何をして遊びたい？',start:'2020-01-01',end:'2099-12-31',status:'active'},{id:'b',label:'B',text:'みんなで何をつくりたい？',start:'2020-01-01',end:'2099-12-31',status:'active'}],groups:[{id:'g1',sid:'a',name:'サッカー',likes:12},{id:'g2',sid:'a',name:'ゲーム大会',likes:5},{id:'g3',sid:'a',name:'鬼ごっこ',likes:3},{id:'g4',sid:'b',name:'お菓子づくり',likes:9},{id:'g5',sid:'b',name:'工作',likes:6},{id:'g6',sid:null,name:'虫取り',likes:7},{id:'g7',sid:null,name:'魚を飼う',likes:18},{id:'g8',sid:null,name:'お祭り',likes:3}],ideas:[{id:'i1',sid:'a',gid:'g1',text:'サッカー大会がしたい',status:'approved'},{id:'i2',sid:'a',gid:'g1',text:'サッカーの試合をしたい',status:'approved'},{id:'i3',sid:'a',gid:'g2',text:'ゲーム大会がしたい',status:'approved'},{id:'i4',sid:'a',gid:'g3',text:'鬼ごっこがしたい',status:'approved'},{id:'i5',sid:'b',gid:'g4',text:'クッキーをつくりたい',status:'approved'},{id:'i6',sid:'b',gid:'g5',text:'段ボールで秘密基地をつくりたい',status:'approved'},{id:'i7',sid:null,gid:'g6',text:'虫取りに行きたい',status:'approved'},{id:'i8',sid:null,gid:'g7',text:'水槽に魚を飼いたい',status:'approved'},{id:'i9',sid:null,gid:'g8',text:'みんなでお祭りがしたい',status:'approved'}],islands:[{id:'island-sample',sid:'a',members:['g1','g3']}]};
const liked=new Set(),survey=id=>db.surveys.find(x=>x.id===id),group=id=>db.groups.find(x=>x.id===id),active=s=>s.status==='active'&&s.start<=day(0)&&s.end>=day(0);

const originalDemoData=JSON.parse(JSON.stringify(db));
try{
 const old=JSON.parse(localStorage.getItem('sannka_demo_data_v3')||'null');
 if(old&&Array.isArray(old.surveys)&&Array.isArray(old.groups)&&Array.isArray(old.ideas)){
  db.surveys=old.surveys;db.groups=old.groups;db.ideas=old.ideas;db.islands=Array.isArray(old.islands)?old.islands:[];
  const nums=[...db.surveys,...db.groups,...db.ideas].map(x=>Number((String(x.id||'').match(/\\d+$/)||[])[0])||0);
  seq=Math.max(seq,...nums);
 }
}catch(e){}
function saveDemo(){try{localStorage.setItem('sannka_demo_data_v3',JSON.stringify(db))}catch(e){}}
function groupCount(gid){return db.ideas.filter(i=>i.gid===gid&&i.status==='approved').length}
if(!Array.isArray(db.islands))db.islands=[];
function islandFor(groupId){return db.islands.find(i=>i.members.includes(groupId))}
function islandName(island){
 const memberNames=island.members.map(id=>group(id)?.name).filter(Boolean);
 return island.name?.trim()||memberNames.join('・')||'関連する発意';
}
if(!Array.isArray(db.pendingIslandNames))db.pendingIslandNames=[];
function setIslandName(island,name){
 if(!island)return false;
 const text=String(name||'').trim().slice(0,30);
 if(!text)return true;
 const hits=findNG(text);
 if(hits.length){
  db.pendingIslandNames=db.pendingIslandNames.filter(x=>x.islandId!==island.id);
  db.pendingIslandNames.push({id:'pin'+(++seq),islandId:island.id,name:text,ngHits:hits});
  saveDemo();
  return false;
 }
 island.name=text;
 db.pendingIslandNames=db.pendingIslandNames.filter(x=>x.islandId!==island.id);
 saveDemo();
 return true;
}
function addToIsland(fromId,targetId){
 const from=group(fromId),target=group(targetId);
 if(!from||!target||from.id===target.id||from.sid!==target.sid)return false;
 const a=islandFor(from.id),b=islandFor(target.id);
 if(a&&b&&a.id===b.id)return false;
 if(a&&b){b.members=[...new Set([...b.members,...a.members])];db.islands=db.islands.filter(i=>i.id!==a.id)}
 else if(b){b.members.push(from.id)}
 else if(a){a.members.push(target.id)}
 else db.islands.push({id:'island'+(++seq),sid:target.sid,members:[target.id,from.id]});
 db.islands.forEach(i=>i.members=[...new Set(i.members)]);
 saveDemo();return true;
}
function removeFromIsland(groupId){
 const island=islandFor(groupId);if(!island)return false;
 island.members=island.members.filter(id=>id!==groupId);
 if(island.members.length<2)db.islands=db.islands.filter(i=>i.id!==island.id);
 saveDemo();return true;
}
function splitIdea(ideaId){
 const idea=db.ideas.find(x=>x.id===ideaId&&x.status==='approved');
 const parent=group(idea?.gid);
 if(!idea||!parent||groupCount(parent.id)<2)return false;
 const newGroup={id:'g'+(++seq),sid:parent.sid,name:suggest(idea.text),likes:0};
 db.groups.push(newGroup);idea.gid=newGroup.id;
 const island=islandFor(parent.id);if(island)island.members.push(newGroup.id);
 saveDemo();return true;
}


/* Bubble / Project Cube MVP: AIは使用せず、発意データと公開済みキューブを接続する */
if(!Array.isArray(db.cubes)){
 db.cubes=[
 {id:'cube-sample-a',gid:'g1',title:'みんなでサッカー大会を開こう',why:'みんなで試合を楽しみたい',how:'チームを考えて、日時とルールを決める',support:'会場・安全確認',status:'mission',likes:7,myLiked:false,powers:2,myPowered:false,goal:6,deadline:'2099-12-31',tasks:'チーム分けとルール決め',createdBy:'demo-child'},
 {id:'cube-sample-b',gid:'g7',title:'水槽の生き物を育てよう',why:'生き物のことを学びたい',how:'育てたい魚を相談し、当番を決める',support:'道具と飼い方の相談',status:'proposed',likes:4,myLiked:false,powers:0,myPowered:false,goal:6,deadline:'2099-12-31',tasks:'',createdBy:'demo-child'}
 ].filter(c=>db.groups.some(g=>g.id===c.gid));
}
function cubeOf(id){return db.cubes.find(c=>c.id===id)}
function cubeStatus(c){return ({proposed:'企画アイデア',mission:'ミッション中',popped:'POP！実行待ち',progress:'実行中',done:'実行完了',pending:'職員の確認待ち',hidden:'非表示',rejected:'非公開'})[c.status]||c.status}
function visibleCubes(gid){return db.cubes.filter(c=>c.gid===gid&&['proposed','mission','popped','progress','done'].includes(c.status))}
function cubeAttached(gid){return visibleCubes(gid).sort((a,b)=>(a.status==='mission'?-2:a.status==='popped'?-1:0)-(b.status==='mission'?-2:b.status==='popped'?-1:0))}
function meter(c){let percent=Math.min(100,Math.round(100*(c.powers||0)/Math.max(1,c.goal||6)));return `<div class="meter" aria-label="投票の達成度 ${percent}%"><span style="width:${percent}%"></span></div><div class="inline-info">⚡ ${c.powers||0} / ${c.goal||6} パワー　（${percent}%）</div>`}
function cubeBlock(c){
 const g=group(c.gid),canVote=c.status==='mission';
 return `<div class="cube-card"><div class="cube-head"><div class="cube-title"><span class="cube-mark">▣</span> ${safe(c.title)}</div><span class="cube-status ${safe(c.status)}">${cubeStatus(c)}</span></div><div class="mini">元のバブル：${safe(g?.name||'不明')}</div><div class="inline-info" style="margin-top:6px">💜 ${c.likes||0} いいね！</div>${canVote?meter(c):''}<div class="actions"><button class="btn small" data-act="cubeDetail" data-id="${safe(c.id)}">キューブを見る</button>${canVote?`<button class="btn primary small" data-act="power" data-id="${safe(c.id)}" ${c.myPowered?'disabled':''}>${c.myPowered?'⚡ 送信済み':'⚡ パワーを送る！'}</button>`:''}</div></div>`;
}
function cubeFormCheck(values){return [...new Set(values.flatMap(x=>findNG(x||'')))]}
function missionBanner(){
 const activeM=db.cubes.filter(c=>c.status==='mission'&&group(c.gid)&&(!group(c.gid).sid||active(survey(group(c.gid).sid)||{})));
 if(!activeM.length)return '';
 return `<div class="mission-banner"><b>📣 Bubble Pop Mission!</b><div class="inline-info">みんなのパワーで、企画をプロジェクトへ！</div><div class="mission-items">${activeM.map(c=>`<button class="mission-entry" data-act="cubeDetail" data-id="${safe(c.id)}"><b>🧊 ${safe(c.title)}</b><span>⚡ ${c.powers||0} / ${c.goal||6}　パワー</span></button>`).join('')}</div></div>`;
}
function cubeSanitizeExisting(){
 for(const c of db.cubes){
  if(['proposed','mission','popped','progress','done'].includes(c.status)){
    const hits=cubeFormCheck([c.title,c.why,c.how,c.support,c.tasks]);
    if(hits.length){c.status='pending';c.ngHits=hits;}
  }
 }
}

const defaultNG=['死ね','しね','死んで','しんで','殺す','殺し','殺せ','殺そう','殺され','ころす','ころし','ころせ','ころそう','ころされ','消えろ','くたばれ'];
let facilityNG=[];
try{const v=JSON.parse(localStorage.getItem('sannka_ngword_demo_v1')||'[]');if(Array.isArray(v))facilityNG=v.filter(x=>typeof x==='string'&&x.length<=30)}catch(e){}
function saveNG(){try{localStorage.setItem('sannka_ngword_demo_v1',JSON.stringify(facilityNG))}catch(e){}}
function normalized(text){return String(text||'').normalize('NFKC').toLowerCase().replace(/[\s　、。．・_＿ー～~！!？?\-]/g,'')}
function findNG(text){const n=normalized(text);return [...new Set([...defaultNG,...facilityNG].filter(w=>w&&n.includes(normalized(w))))]}

/* すべての公開テキストに共通の審査ロジックを適用 */
if(!Array.isArray(db.pendingNames))db.pendingNames=[];
function scanExistingText(){
 for(const q of db.surveys){
  if(q.status==='active'){
   const hits=findNG(q.text);
   if(hits.length){q.status='pending';q.ngHits=hits;}
  }
 }
 for(const i of db.ideas){
  if(i.status==='approved'){
   const hits=findNG(i.text);
   if(hits.length){i.status='pending';i.ngHits=hits;}
  }
 }
 for(const i of db.islands){
  if(i.name&&findNG(i.name).length){
    const proposed=i.name;i.name='';db.pendingIslandNames=db.pendingIslandNames||[];
    if(!db.pendingIslandNames.some(x=>x.islandId===i.id))db.pendingIslandNames.push({id:'pin'+(++seq),islandId:i.id,name:proposed,ngHits:findNG(proposed)});
  }
 }
 for(const g of db.groups){
  if(!g.hidden&&findNG(g.name).length){
   const hits=findNG(g.name);
   g.hidden=true;

if(a==='confirmAttachIdea'){
 let target=$('#attachTarget')?.value, desired=$('#islandNameInput')?.value.trim();
 let idea=db.ideas.find(i=>i.id===id);if(idea&&addToIsland(idea.gid,target)){const island=islandFor(target);const okay=desired?setIslandName(island,desired):true;close();view='board';render();if(!okay)popup('<h3>島名は確認待ちです</h3><div class="notice">NGワードに該当した島名だけを保留しました。</div><div class="actions"><button class="btn primary" data-act="board">戻る</button></div>')}
 return;
}


if(a==='renameIsland'){
 const island=db.islands.find(i=>i.id===id);if(!island)return;
 popup(`<h3>島の名前を変更</h3><div class="muted">名前は島の上部に小さなタグで表示されます。丸の名前やいいね数は変更されません。</div><div class="field"><label>島の名前</label><input id="renameIslandText" maxlength="30" value="${safe(island.name||'')}" placeholder="例：ごっこ遊び"></div><div class="actions"><button class="btn primary" data-act="saveIslandName" data-id="${safe(island.id)}">名前を保存</button></div>`);
 return;
}
if(a==='saveIslandName'){
 const island=db.islands.find(i=>i.id===id),name=$('#renameIslandText')?.value.trim();if(!island)return;
 if(!name){island.name='';close();render();return}
 const okay=setIslandName(island,name);close();render();
 if(!okay)popup('<h3>島名は確認待ちです</h3><div class="notice">NGワードに該当したため名前の変更を保留しました。既存の名前は維持されます。</div><div class="actions"><button class="btn primary" data-act="manage">保留一覧を見る</button></div>');
 return;
}
if(a==='unlinkIsland'){if(removeFromIsland(id)){view='board';render()}return}
if(a==='chooseSplit'){
let g=group(id);if(!g)return;
let ideas=db.ideas.filter(i=>i.gid===id&&i.status==='approved');
popup(`<h3>別のバブルに分ける</h3><div class="muted">以前に1つの丸へまとめた回答を分け直すことができます。ただし当時のいいねの配分は復元できません。</div><div class="field"><label>別バブルに戻す発意</label><select id="splitTarget">${ideas.map(i=>`<option value="${i.id}">${safe(i.text)}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" data-act="confirmSplit">分ける</button></div>`);
return;
}
if(a==='confirmSplit'){
let ideaId=$('#splitTarget')?.value;
if(ideaId&&splitIdea(ideaId)){close();view='board';render()}
return;
}

/* 新しい発意体験 Bubble → Grow → Set → Cube → Mission → POP */
if(a==='cubeForm'){
 const g=group(id);if(!g||g.hidden)return;
 popup(`<div class="brand">PROJECT CUBE</div><h3>🧊 キューブを届ける</h3>
 <div class="notice">「${safe(g.name)}」のバブルを、どんなふうに実現したい？ こども自身の言葉で考えてね。</div>
 <div class="field"><label>企画の名前 *</label><input id="cubeTitle" maxlength="70" placeholder="例：みんなで虫取り探検！"></div>
 <div class="field"><label>どうしてやりたい？</label><textarea id="cubeWhy" maxlength="240" placeholder="あなたが思っていること"></textarea></div>
 <div class="field"><label>どうやってやる？ *</label><textarea id="cubeHow" maxlength="320" placeholder="準備することや、やり方"></textarea></div>
 <div class="field"><label>どんなサポートが必要？</label><textarea id="cubeSupport" maxlength="240" placeholder="リーダーに手伝ってほしいことなど"></textarea></div>
 <div class="inline-info">AIは使いません。自分の言葉をそのまま残します。</div>
 <div class="actions"><button class="btn primary" data-act="submitCube" data-id="${safe(g.id)}">キューブを届ける！</button></div>`);
 return;
}
if(a==='submitCube'){
 const g=group(id);if(!g)return;
 const title=$('#cubeTitle')?.value.trim(),why=$('#cubeWhy')?.value.trim()||'',how=$('#cubeHow')?.value.trim(),support=$('#cubeSupport')?.value.trim()||'';
 if(!title){$('#cubeTitle')?.focus();return}
 if(!how){$('#cubeHow')?.focus();return}
 const hits=cubeFormCheck([title,why,how,support]);
 const cube={id:'cube'+(++seq),gid:g.id,title,why,how,support,status:hits.length?'pending':'proposed',likes:0,myLiked:false,powers:0,myPowered:false,goal:6,deadline:'2099-12-31',tasks:'',createdBy:'demo-child',ngHits:hits};
 db.cubes.push(cube);saveDemo();
 popup(`<h3>${hits.length?'確認中です':'キューブが届いた！'}</h3><div class="success">${hits.length?'NGワードに該当したため、職員確認まで公開を保留しました。':'🧊 あなたの企画がバブルとつながりました。仲間の「いいね！」で育てられます。'}</div><div class="actions"><button class="btn primary" data-act="board">ボードに戻る</button>${hits.length?'<button class="btn" data-act="manage">確認画面へ</button>':`<button class="btn" data-act="cubeDetail" data-id="${safe(cube.id)}">キューブを見る</button>`}</div>`);
 return;
}
if(a==='cubeDetail'){
 const c=cubeOf(id);if(!c)return;
 const g=group(c.gid);
 const show=['proposed','mission','popped','progress','done'].includes(c.status);
 if(!show&&role!=='staff')return;
 popup(`<div class="brand">PROJECT CUBE</div><h3>🧊 ${safe(c.title)}</h3>
 <div class="inline-info"><span class="badge">${cubeStatus(c)}</span>　元のバブル：${safe(g?.name||'不明')}</div>
 <div class="field"><label>どうしてやりたい？</label><div class="notice">${safe(c.why||'これから考える')}</div></div>
 <div class="field"><label>どうやってやる？</label><div class="notice">${safe(c.how||'これから考える')}</div></div>
 <div class="field"><label>リーダーにお願いしたいこと</label><div class="notice">${safe(c.support||'今はありません')}</div></div>
 <div class="inline-info">💜 ${c.likes||0} いいね！　<span class="badge">いいね＝共感</span></div>
 ${c.status==='mission'?`<div class="mission-banner"><b>📣 Bubble Pop Mission!</b>${meter(c)}<div class="inline-info">投票期限：${safe(c.deadline||'未設定')}</div></div>`:''}
 ${['popped','progress','done'].includes(c.status)?`<div class="success">🎉 POP!　みんなのプロジェクトとして誕生しました。<div class="inline-info">役割・支援：${safe(c.tasks||'これから決める')}</div></div>`:''}
 <div class="actions"><button class="btn" data-act="cubeList">キューブ一覧</button><button class="btn" data-act="cubeLike" data-id="${safe(c.id)}">${c.myLiked?'💜 いいね済み':'♡ いいね！'}</button>
 ${c.status==='mission'?`<button class="btn primary" data-act="power" data-id="${safe(c.id)}" ${c.myPowered?'disabled':''}>${c.myPowered?'⚡ 送信済み':'⚡ Power to Pop!'}</button>`:''}
 ${role==='staff'&&c.status==='proposed'?`<button class="btn primary" data-act="missionStart" data-id="${safe(c.id)}">📣 ミッションを発動</button>`:''}
 ${role==='staff'&&c.status==='popped'?`<button class="btn primary" data-act="markProgress" data-id="${safe(c.id)}">🚀 実行準備へ</button>`:''}
 </div>`);
 return;
}
if(a==='cubeLike'){
 const c=cubeOf(id);if(!c||!['proposed','mission','popped','progress','done'].includes(c.status))return;
 c.likes=Math.max(0,(c.likes||0)+(c.myLiked?-1:1));c.myLiked=!c.myLiked;saveDemo();render();act('cubeDetail',id);return;
}
if(a==='missionStart'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c||c.status!=='proposed')return;
 popup(`<h3>📣 Bubble Pop Mission! を発動</h3><div class="notice">🧊 ${safe(c.title)}<br>この企画の実行に向けた意思を、施設のみんなに聞きます。少数意見や反対意見を尊重し、目標達成後の実行も施設とこどもで確認します。</div>
 <div class="field"><label>目標パワー数（投票数）</label><input id="missionGoal" type="number" min="1" max="999" value="6"></div>
 <div class="field"><label>投票の締切</label><input id="missionDeadline" type="date" value="${day(7)}"></div>
 <div class="actions"><button class="btn primary" data-act="missionActivate" data-id="${safe(c.id)}">ミッション開始！</button></div>`);
 return;
}
if(a==='missionActivate'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c||c.status!=='proposed')return;
 const goal=Number($('#missionGoal')?.value),date=$('#missionDeadline')?.value;
 if(!Number.isInteger(goal)||goal<1||goal>999||!date||date<day(0)){alert('目標数と締切を確認してください');return}
 c.status='mission';c.goal=goal;c.powers=0;c.myPowered=false;c.deadline=date;saveDemo();close();view='board';render();return;
}
if(a==='power'){
 const c=cubeOf(id);if(!c||c.status!=='mission'||c.myPowered)return;
 if(c.deadline&&c.deadline<day(0)){popup('<h3>投票期間が終了しています</h3><div class="notice">職員が結果を確認しています。</div><div class="actions"><button class="btn" data-act="board">ボードへ</button></div>');return}
 c.myPowered=true;c.powers=(c.powers||0)+1;
 if(c.powers>=Math.max(1,c.goal||6)){
  c.status='popped';saveDemo();render();
  popup(`<div class="pop-scene"><div class="big-pop">🎉 POP!</div><h3>Congrats!</h3><div class="cube-emoji">🫧 ✨ 🧊 🚀</div><p>バブルがはじけて<br><b>みんなのプロジェクト</b>にへんしんしたよ！</p></div><div class="inline-info">「${safe(c.title)}」は実行準備へ進む状態になりました。実施内容や安全面は、こどもと施設で相談して決めます。</div><div class="actions"><button class="btn primary" data-act="cubeDetail" data-id="${safe(c.id)}">プロジェクトを見る</button></div>`);
 }else{saveDemo();render();act('cubeDetail',id)}
 return;
}

if(a==='demoBoost'){
 if(role!=='staff')return;const c=cubeOf(id);
 if(!c||c.status!=='mission')return;
 c.powers=(c.powers||0)+1;
 if(c.powers>=Math.max(1,c.goal||6)){
  c.status='popped';saveDemo();render();
  popup(`<div class="pop-scene"><div class="big-pop">🎉 POP!</div><h3>Congrats!</h3><p>${safe(c.title)}<br>みんなのプロジェクトにへんしん！</p></div><div class="inline-info">デモ用の応援を加算して目標達成を再現しました。実施前に安全・資源・少数意見の確認が必要です。</div><div class="actions"><button class="btn primary" data-act="cubeDetail" data-id="${safe(c.id)}">キューブを見る</button></div>`);
 }else{saveDemo();render()}
 return;
}
if(a==='missionStop'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='mission'){c.status='proposed';saveDemo();render()}return;
}
if(a==='markProgress'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='popped'){c.status='progress';saveDemo();render()}return;
}
if(a==='markDone'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='progress'){c.status='done';saveDemo();render()}return;
}
if(a==='taskEdit'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c)return;
 popup(`<h3>実行の役割・施設のサポート</h3><div class="notice">${safe(c.title)}</div><div class="field"><label>役割分担・準備・サポート</label><textarea id="cubeTasks" maxlength="400" placeholder="担当や準備、安全確認などを入力">${safe(c.tasks||'')}</textarea></div><div class="actions"><button class="btn primary" data-act="taskSave" data-id="${safe(c.id)}">保存する</button></div>`);return;
}
if(a==='taskSave'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c)return;
 const tasks=$('#cubeTasks')?.value.trim()||'';const hits=findNG(tasks);
 if(hits.length){popup('<h3>確認が必要な表現があります</h3><div class="notice">NGワードを検出したため、公開用の支援内容を保存しませんでした。表現を確認してください。</div><div class="actions"><button class="btn" data-act="cubeDetail" data-id="'+id+'">戻る</button></div>');return}
 c.tasks=tasks;saveDemo();close();render();return;
}
if(a==='approveCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='pending'){c.status='proposed';saveDemo();render()}return;
}
if(a==='rejectCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(c&&c.status==='pending'){c.status='rejected';saveDemo();render()}return;
}
if(a==='hideCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(c){c.previousStatus=c.status;c.status='hidden';saveDemo();render()}return;
}
if(a==='restoreCube'){
 if(role!=='staff')return;const c=cubeOf(id);if(!c)return;
 const hits=cubeFormCheck([c.title,c.why,c.how,c.support,c.tasks]);
 if(hits.length){c.status='pending';c.ngHits=hits}else c.status=c.previousStatus||'proposed';
 saveDemo();render();return;
}
if(a==='like'){let g=group(id);if(!g)return;g.likes+=liked.has(id)?-1:1;liked.has(id)?liked.delete(id):liked.add(id);render();act('detail',id);return}
if(a==='rejectSurvey'){let q=survey(id);if(q){q.status='rejected';render()}return}
if(a==='approveName'){let n=db.pendingNames.find(x=>x.id===id);if(!n)return;let g=group(n.gid);if(g){g.name=n.name;g.hidden=false}db.pendingNames=db.pendingNames.filter(x=>x.id!==id);render();return}
if(a==='rejectName'){let n=db.pendingNames.find(x=>x.id===id);if(!n)return;let g=group(n.gid);if(g&&n.legacy){g.name='確認済みの発意';g.hidden=false}db.pendingNames=db.pendingNames.filter(x=>x.id!==id);render();return}
if(a==='approveIslandName'){let n=db.pendingIslandNames.find(x=>x.id===id);if(!n)return;let island=db.islands.find(x=>x.id===n.islandId);if(island)island.name=n.name;db.pendingIslandNames=db.pendingIslandNames.filter(x=>x.id!==id);render();return}
if(a==='rejectIslandName'){db.pendingIslandNames=db.pendingIslandNames.filter(x=>x.id!==id);render();return}
if(a==='approveSurvey'){let q=survey(id);if(q){q.status='active';if(q.start>day(0))q.start=day(0);if(q.end<day(0))q.end=day(7)}render();return}
if(a==='approveIdea'){let i=db.ideas.find(i=>i.id===id);if(!i)return;publishIdea(i);render();return}
if(a==='rejectIdea'){let i=db.ideas.find(i=>i.id===id);if(i)i.status='rejected';render();return}
if(a==='addNGWord'){let word=$('#addNGWord')?.value.trim();if(!word)return;const target=normalized(word);if(!target||[...defaultNG,...facilityNG].some(x=>normalized(x)===target)){alert('同じNGワードが登録されています');return}facilityNG.push(word.slice(0,30));saveNG();scanExistingText();cubeSanitizeExisting();render();return}
if(a==='removeNGWord'){let ix=Number(id);if(Number.isInteger(ix)&&ix>=0&&ix<facilityNG.length){facilityNG.splice(ix,1);saveNG();render()}return}
if(a==='hideIdea'){let i=db.ideas.find(i=>i.id===id);if(i&&i.status==='approved'){i.status='hidden';let g=group(i.gid);if(g&&!db.ideas.some(x=>x.gid===g.id&&x.status==='approved'))g.hidden=true;}render();return}
if(a==='restoreIdea'){let i=db.ideas.find(i=>i.id===id);if(i&&i.status==='hidden'){const hits=findNG(i.text);i.ngHits=hits;if(hits.length){i.status='pending'}else{i.status='approved';let g=group(i.gid);if(g)g.hidden=false;}}render();return}
if(a==='archive'){let q=survey(id);if(q)q.status='archived';render();return}
if(a==='history'){let q=survey(id);if(!q)return;let li=db.ideas.filter(i=>i.sid===id&&i.status==='approved');popup(`<h3>アンケートの履歴</h3><div class="notice"><b>${safe(q.text)}</b><br>${safe(q.start)}〜${safe(q.end)}<br>承認済み ${li.length}件</div>${li.map(i=>`<div class="entry">${safe(i.text)}</div>`).join('')}`);return}
if(a==='rename'){let g=group(id);popup(`<h3>グループ名の変更</h3><div class="field"><label>グループ名</label><input id="renameText" value="${safe(g.name)}"></div><div class="actions"><button class="btn primary" data-act="saveName" data-id="${id}">変更する</button></div>`);return}
if(a==='saveName'){
 let g=group(id),name=$('#renameText')?.value.trim();if(!g||!name){$('#renameText')?.focus();return}
 const hits=findNG(name);
 if(hits.length){
  db.pendingNames=db.pendingNames.filter(x=>x.gid!==g.id||x.legacy);
  db.pendingNames.push({id:'pn'+(++seq),gid:g.id,name,ngHits:hits,legacy:false});
  saveDemo();
  popup(`<h3>グループ名を確認中です</h3><div class="notice">NGワードを検出したため、変更はまだ公開していません。現在の名前のまま職員確認待ちになります。</div><div class="actions"><button class="btn" data-act="board">ボードに戻る</button><button class="btn primary" data-act="manage">保留一覧へ</button></div>`);
 }else{g.name=name;close();render()}
 return
}}
root.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a){e.preventDefault();act(a.dataset.act,a.dataset.id);return}const r=e.target.closest('[data-role]');if(r){role=r.dataset.role;render();return}const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}});
root.addEventListener('change',e=>{if(e.target.id==='src'){selection=e.target.value;render();return}if(e.target.dataset.move){let i=db.ideas.find(x=>x.id===e.target.dataset.move);if(i){i.gid=e.target.value;render()}}});
root.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
})();
</script>
</div></body></html>
